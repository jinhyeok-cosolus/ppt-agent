<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>COSOLUS 표지 테스트 - 난연 마스터배치</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<!--
  테스트용 표지 1장짜리 웹PPT (v2 — 표지 전용 규칙 반영판).
  레이아웃 근거: docs/slide-design-rules/01_cover_design_V2.md
  (표지 슬라이드는 4순위 범용 Layout Reference L01~L33보다 이 문서를 우선 적용 —
  L01 카탈로그는 이번 개정에서 더 이상 참고하지 않음)
  - Layout: Full Background 구조, 브랜드(워드마크) 좌측 상단, 제목 슬라이드 중앙 배치, 1줄 구성.
  - Additional Rules: 페이지 번호 표시하지 않음(v1에서 있던 하단 페이지 번호 제거).
  - Additional Rules 예외 적용: 실제 회사 사진/로고 파일이 /docs/brand-assets/에 아직
    등록되어 있지 않아 "적합한 배경 이미지가 없는 경우" 조건에 해당 → 이미지를 임의로
    생성하지 않고 COSOLUS Brand Color 기반 단색(Deep Pine) 배경으로 대체함.
  - Avoid 준수: 장식적 요소(v1에 있던 강조선 등)를 최소화해 브랜드/제목에만 집중.
-->
<div id="deck">

  <section class="slide slide--cover" data-index="1">
    <div class="cover-brand" aria-label="COSOLUS">COSOLUS</div>
    <div class="cover-title-block">
      <h1 class="cover-title">난연 마스터배치</h1>
    </div>
  </section>

  <!-- SLIDES:INSERT (이번 테스트는 표지 1장만 생성 — 본문 슬라이드 없음) -->

</div>

<div id="nav-hint" aria-hidden="true">← → 키로 슬라이드 이동</div>

<script src="assets/vendor/chart.min.js"></script>
<script>
  // 슬라이드 간 이동(브라우저 프레젠테이션 모드 대체용 최소 스크립트)
  const slides = Array.from(document.querySelectorAll(".slide"));
  let current = 0;
  function show(i) {
    slides.forEach((s, idx) => s.classList.toggle("is-active", idx === i));
  }
  document.addEventListener("keydown", (e) => {
    if (e.key === "ArrowRight" && current < slides.length - 1) { current++; show(current); }
    if (e.key === "ArrowLeft" && current > 0) { current--; show(current); }
  });
  if (slides.length <= 1) {
    const hint = document.getElementById("nav-hint");
    if (hint) hint.style.display = "none";
  }
  show(0);
</script>
</body>
</html>
