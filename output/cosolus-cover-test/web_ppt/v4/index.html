<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>COSOLUS 표지 테스트 - 난연 마스터배치</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<!--
  테스트용 표지 1장짜리 웹PPT (v4 — 01_cover_design_V2.md Reference 비교 기반
  최소 개정 반영판).
  레이아웃 근거: docs/slide-design-rules/01_cover_design_V2.md
  (표지 슬라이드는 4순위 범용 Layout Reference L01~L33보다 이 문서를 우선 적용)

  v3 -> v4 변경 (문서 개정 4건만 반영, 레이아웃 골격/배경 이미지/로고 파일은 v3와 동일,
  새 디자인 규칙 추가 없음 — 상세 근거는 style.css 상단 주석 참고):
  1. Brand Block 좌측 정렬: 로고 좌측 여백 0px 확인, 구조 변경 없음.
  2. 로고 크기: height 24px -> 36px.
  3. 오버레이 톤: Deep Pine 중심 어두운 톤(알파 0.72~0.90) -> Ocean Blue/Mint/
     Cosolus Teal 기반 밝고 저채도 톤(알파 0.30~0.55).
  4. 제목 영역 max-width: 780px -> 960px.
-->
<div id="deck">

  <section class="slide slide--cover" data-index="1">
    <img class="cover-bg-image" src="assets/images/cover-background.png" alt="" aria-hidden="true">
    <div class="cover-overlay" aria-hidden="true"></div>

    <div class="cover-brand">
      <p class="cover-brand-sub">COSOLUS, small actions, BIG DIFFERENCE</p>
      <img class="cover-brand-logo" src="assets/images/logo-white.png" alt="COSOLUS">
    </div>

    <div class="cover-title-block">
      <h1 class="cover-title">난연 마스터배치</h1>
    </div>
  </section>

  <!-- SLIDES:INSERT (이번 테스트는 표지 1장만 생성 — 본문 슬라이드 없음) -->

</div>

<div id="nav-hint" aria-hidden="true">← → 키로 슬라이드 이동</div>

<script src="assets/vendor/chart.min.js"></script>
<script>
  // 슬라이드 간 이동(브라우저 프레젠테이션 모드 대체용 최소 스크립트)
  const slides = Array.from(document.querySelectorAll(".slide"));
  let current = 0;
  function show(i) {
    slides.forEach((s, idx) => s.classList.toggle("is-active", idx === i));
  }
  document.addEventListener("keydown", (e) => {
    if (e.key === "ArrowRight" && current < slides.length - 1) { current++; show(current); }
    if (e.key === "ArrowLeft" && current > 0) { current--; show(current); }
  });
  if (slides.length <= 1) {
    const hint = document.getElementById("nav-hint");
    if (hint) hint.style.display = "none";
  }
  show(0);
</script>
</body>
</html>
