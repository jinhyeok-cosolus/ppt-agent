<!doctype html>
<html><head><meta charset="utf-8"><style>html,body{margin:0;width:1280px;height:720px;overflow:hidden;background:#fff}iframe{display:block;width:1280px;height:720px;border:0}</style></head>
<body><iframe id="deck" src="../../web_ppt/v2/index.html"></iframe><script>
const frame=document.getElementById('deck');
frame.addEventListener('load',()=>{const d=frame.contentDocument;d.body.style.background='#fff';const deck=d.getElementById('deck');deck.style.padding='0';deck.style.gap='0';[...d.querySelectorAll('.slide')].forEach((s,i)=>s.style.display=i===4?'block':'none');});
</script></body></html>
