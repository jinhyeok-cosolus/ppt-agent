<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>15p Process 배치·Sibling Outputs 적용 재테스트(v9)</title>
<!--
  input/15, 16p 테스트용_7.docx와 동일 콘텐츠·이미지. flow-diagram-rules.md에
  새로 추가된 두 규칙을 이번에 처음 실제 좌표로 구현한다(v8의 좌표 재사용
  안 함, 새 클래스 px9-):

  1) 공정(Process) 라벨·이미지-Connector 수직 배치 규칙: 전처리/용매추출/
     부유선별/건식환원/유도가열(모두 Process 노드)은 각자의 수평 Connector
     Trunk Y 선 "위쪽"에 라벨→이미지 순서로 뜨고, Connector는 그 아래를
     끊기지 않고 연속으로 지나간다(Connector→Image→Connector 금지).
     Material/Output 노드(배터리팩/블랙매스/블랙매스류/파우더/코발트/니켈/
     흑연류)는 이 규칙 예외로 Connector 축에 그대로 얹는다.
  2) Sibling Outputs 분기 규칙: 용매추출의 결과물 2종(재활용 양극재 4종
     그룹 / 폐흑연)과 건식환원의 결과물 2종(코발트/니켈)을 Process→OutputA
     →OutputB로 순차 연결하지 않고, 각각 하나의 공통 Branch Point에서
     위/아래로 갈라지는 Fork로 연결했다.

  Region Map(§0)의 1차 분기점 X=35%, 2세대 내부 재분기 X=52%, 결과물 영역
  시작 X=70%, Lane 경계 Y=47%는 v8과 동일하게 유지(이 값 자체는 이번에
  바뀌지 않았음 — 오늘 수정된 것은 Process 노드 배치·Sibling 분기 규칙).
  색상(#C0392B/#034443)·Connector 화살표 도형·Typography(14pt Bold 이상)·
  아이콘 무테두리·점선 구분선 규칙은 그대로 적용. 이미지는 v7과 동일 원본
  재사용(신규 없음). Header는 Hard Rule §9 그대로.
-->
<style>
  :root {
    --c-dark: #034443; --c-ink: #162B1F; --c-slate: #5A6664; --c-gray: #8C9694;
    --c-submessage: #478689; --c-white: #FFFFFF; --c-r: #C0392B; --c-g: #034443;
    --font-base: "Pretendard", "Malgun Gothic", "맑은 고딕", sans-serif;
    --branch-x: 35%; --subbranch-x: 52%; --result-x: 70%; --lane-y: 47%;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #555; font-family: var(--font-base); color: var(--c-ink); word-break: keep-all; }
  #deck { display: flex; padding: 24px; }
  .slide { position: relative; width: 1280px; height: 720px; background: var(--c-white); overflow: hidden; }

  .hdr-ci { position: absolute; left: 64px; top: 25px; height: 20px; }
  .hdr-ci img { height: 20px; width: auto; display: block; }
  .hdr-submessage { position: absolute; right: 64px; top: 25px; font: 500 14pt/20px var(--font-base); color: var(--c-submessage); white-space: nowrap; }
  .hdr-divider { position: absolute; left: 64px; top: 56px; width: 1152px; height: 1px; background: var(--c-submessage); }
  .hdr-section-label { position: absolute; left: 68px; top: 62px; font: 300 12pt var(--font-base); color: var(--c-gray); letter-spacing: 0.06em; text-transform: uppercase; }
  .hdr-main-title { position: absolute; left: 64px; top: 83px; width: 1152px; font: 800 28pt/1.25 var(--font-base); color: var(--c-dark); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .hdr-page-number { position: absolute; right: 44px; bottom: 24px; font: 300 14pt var(--font-base); color: var(--c-gray); }

  .body-box { position: absolute; left: 64px; top: 135px; width: 1152px; height: 521px; }

  .px9-node { position: absolute; display: flex; flex-direction: column; align-items: center; gap: 4px; transform: translate(-50%, 0); }
  .px9-node.onLine { transform: translate(-50%, -50%); }
  .px9-node.label-top { flex-direction: column-reverse; }
  .px9-node img { height: 40px; width: auto; max-width: 60px; object-fit: contain; }
  .px9-node .lbl { font: 700 14pt/1.15 var(--font-base); text-align: center; color: var(--c-ink); white-space: nowrap; }
  .lbl.underline { text-decoration: underline; }

  .px9-line { position: absolute; height: 3px; }
  .px9-line.neutral { background: var(--c-slate); }
  .px9-line.r { background: var(--c-r); }
  .px9-line.g { background: var(--c-g); }
  .px9-arrowhead { position: absolute; width: 0; height: 0; border-top: 6px solid transparent; border-bottom: 6px solid transparent; border-left: 9px solid; transform: translateY(-50%); }
  .px9-arrowhead.neutral { border-left-color: var(--c-slate); }
  .px9-arrowhead.r { border-left-color: var(--c-r); }
  .px9-arrowhead.g { border-left-color: var(--c-g); }

  .px9-bracket-v {
    position: absolute; left: var(--branch-x); top: 20%; height: 53%; width: 3px;
    background: linear-gradient(to bottom, var(--c-r) 0%, var(--c-r) 50%, var(--c-g) 50%, var(--c-g) 100%);
  }
  .px9-subbracket-v { position: absolute; left: var(--subbranch-x); top: 60%; height: 26%; width: 2.5px; background: var(--c-g); }

  .px9-fork-v { position: absolute; width: 2.5px; }
  .px9-fork-v.r { background: var(--c-r); }
  .px9-fork-v.g { background: var(--c-g); }
  .px9-fork-dot { position: absolute; width: 6px; height: 6px; border-radius: 50%; transform: translate(-50%, -50%); }
  .px9-fork-dot.r { background: var(--c-r); }
  .px9-fork-dot.g { background: var(--c-g); }

  .px9-result-label { position: absolute; font: 700 14pt var(--font-base); color: var(--c-ink); white-space: nowrap; transform: translate(-50%, 0); }
  .px9-powrow { position: absolute; display: flex; gap: 8px; transform: translate(-50%, 0); }
  .px9-powrow img { width: 34px; height: 28px; object-fit: contain; }

  .px9-divider-dashed { position: absolute; left: var(--branch-x); right: 2%; top: var(--lane-y); height: 0; border-top: 2px dashed var(--c-slate); }
</style>
</head>
<body>
<div id="deck">
<section class="slide">
  <div class="hdr-ci"><img src="assets/images/ci-color.png" alt="COSOLUS"></div>
  <div class="hdr-submessage">We promise tomorrow</div>
  <div class="hdr-divider"></div>
  <div class="hdr-section-label">TECHNOLOGY</div>
  <div class="hdr-main-title">[솔루션2] 개요 – 친환경 차세대 배터리 재활용 공정기술 (2세대)</div>

  <div class="body-box">

    <!-- ================= 공통 시작 영역 (X 0~35%, Trunk Y=47%) ================= -->
    <!-- 연속 Trunk Line: 0% -> 35%(분기점) -->
    <div class="px9-line neutral" style="left:3%; width:32%; top:47%;"></div>

    <!-- 전기차배터리팩: Material Node → Trunk 위에 그대로(예외) -->
    <div class="px9-node onLine" style="left:4%; top:47%;">
      <img src="assets/images/start-ev-battery.png" alt="전기차 배터리팩"><span class="lbl">전기차<br>배터리팩</span>
    </div>

    <!-- 전처리: Process Node → Trunk 위쪽에 라벨→이미지, Connector는 아래로 연속 -->
    <div class="px9-node label-top" style="left:17%; top:26%;">
      <span class="lbl">전처리</span><img src="assets/images/pretreat-icon.png" alt="전처리">
    </div>

    <!-- 블랙매스: Material Node → Trunk 위에(예외), 1차 분기점 직전 -->
    <div class="px9-node onLine" style="left:30%; top:47%;">
      <img src="assets/images/blackmass.png" alt="블랙매스"><span class="lbl">블랙매스</span>
    </div>
    <div class="px9-arrowhead neutral" style="left:calc(35% - 6px); top:47%;"></div>

    <!-- ================= 1차 분기점: X=35% (Region Map) ================= -->
    <span class="px9-bracket-v"></span>

    <!-- ================= 상단 Lane(1세대, Trunk Y=20%, 전부 빨강) ================= -->
    <div class="px9-line r" style="left:35%; width:9%; top:20%;"></div>
    <!-- 용매추출: Process Node → Trunk(20%) 위쪽 -->
    <div class="px9-node label-top" style="left:44%; top:2%;">
      <span class="lbl">용매추출</span><img src="assets/images/gen1-extraction-equip.png" alt="용매추출">
    </div>
    <div class="px9-line r" style="left:44%; width:20%; top:20%;"></div>
    <div class="px9-arrowhead r" style="left:calc(64% - 6px); top:20%;"></div>

    <!-- Sibling Outputs 분기점(용매추출 결과물 2종): X=64%, Trunk Y=20% -->
    <span class="px9-fork-dot r" style="left:64%; top:20%;"></span>
    <span class="px9-fork-v r" style="left:64%; top:8%; height:12%;"></span>
    <!-- 위: Output A(재활용 양극재 4종, 공통 라벨) -->
    <div class="px9-line r" style="left:64%; width:6%; top:8%;"></div>
    <div class="px9-arrowhead r" style="left:calc(70% - 6px); top:8%;"></div>
    <div class="px9-powrow" style="left:85%; top:1%;">
      <img src="assets/images/gen1-mnso4.png" alt="MnSO4">
      <img src="assets/images/gen1-niso4.png" alt="NiSO4">
      <img src="assets/images/gen1-coso4.png" alt="CoSO4">
      <img src="assets/images/gen1-li2co3.png" alt="Li2CO3">
    </div>
    <div class="px9-result-label" style="left:85%; top:12%;">재활용 양극재</div>
    <!-- 아래: Output B(폐흑연) -->
    <div class="px9-line r" style="left:64%; width:6%; top:32%;"></div>
    <div class="px9-arrowhead r" style="left:calc(70% - 6px); top:32%;"></div>
    <div class="px9-node onLine" style="left:78%; top:32%; flex-direction:row; gap:8px;">
      <img src="assets/images/gen1-waste-graphite.jpeg" alt="폐흑연" style="height:28px;"><span class="lbl">폐흑연</span>
    </div>

    <!-- ================= 1세대/2세대 구분 점선: Y=47% ================= -->
    <span class="px9-divider-dashed"></span>

    <!-- ================= 하단 Lane(2세대, Trunk Y=73%, 전부 다크그린) ================= -->
    <div class="px9-line g" style="left:35%; width:9%; top:73%;"></div>
    <!-- 부유선별: Process Node → Trunk(73%) 위쪽 -->
    <div class="px9-node label-top" style="left:44%; top:55%;">
      <span class="lbl underline">부유선별</span><img src="assets/images/gen2-flotation-equip.png" alt="부유선별">
    </div>
    <div class="px9-line g" style="left:44%; width:8%; top:73%;"></div>
    <div class="px9-arrowhead g" style="left:calc(52% - 6px); top:73%;"></div>

    <!-- 2세대 내부 재분기(카테고리 분기, Region Map): X=52% -->
    <span class="px9-subbracket-v"></span>

    <!-- ---- 재분기 위: 양극재용 블랙매스 → 건식환원 → (Sibling: 코발트/니켈) ---- -->
    <div class="px9-line g" style="left:52%; width:6%; top:60%;"></div>
    <div class="px9-node onLine" style="left:58%; top:60%;">
      <img src="assets/images/gen2-cathode-blackmass.png" alt="양극재용 블랙매스"><span class="lbl">양극재용<br>블랙매스</span>
    </div>
    <div class="px9-line g" style="left:58%; width:6%; top:60%;"></div>
    <div class="px9-node label-top" style="left:64%; top:44%;">
      <span class="lbl underline">건식환원</span><img src="assets/images/gen2-dryreduction.png" alt="건식환원">
    </div>
    <div class="px9-line g" style="left:64%; width:6%; top:60%;"></div>
    <div class="px9-arrowhead g" style="left:calc(70% - 6px); top:60%;"></div>

    <!-- Sibling Outputs 분기점(건식환원 결과물 2종): X=70%, Trunk Y=60% -->
    <span class="px9-fork-dot g" style="left:70%; top:60%;"></span>
    <span class="px9-fork-v g" style="left:70%; top:52%; height:12%;"></span>
    <div class="px9-line g" style="left:70%; width:6%; top:52%;"></div>
    <div class="px9-arrowhead g" style="left:calc(76% - 6px); top:52%;"></div>
    <div class="px9-node onLine" style="left:84%; top:52%;">
      <img src="assets/images/gen2-cobalt.png" alt="코발트"><span class="lbl">코발트</span>
    </div>
    <div class="px9-line g" style="left:70%; width:6%; top:68%;"></div>
    <div class="px9-arrowhead g" style="left:calc(76% - 6px); top:68%;"></div>
    <div class="px9-node onLine" style="left:84%; top:68%;">
      <img src="assets/images/gen2-nickel.png" alt="니켈"><span class="lbl">니켈</span>
    </div>

    <!-- ---- 재분기 아래: 음극재용 블랙매스 → 유도가열 → 고순도 정제흑연(단일 결과물) ---- -->
    <div class="px9-line g" style="left:52%; width:6%; top:86%;"></div>
    <div class="px9-node onLine" style="left:58%; top:86%;">
      <img src="assets/images/gen2-anode-blackmass.png" alt="음극재용 블랙매스"><span class="lbl">음극재용<br>블랙매스</span>
    </div>
    <div class="px9-line g" style="left:58%; width:6%; top:86%;"></div>
    <div class="px9-node label-top" style="left:64%; top:70%;">
      <span class="lbl underline">유도가열</span><img src="assets/images/gen2-induction-heat.png" alt="유도가열">
    </div>
    <div class="px9-line g" style="left:64%; width:14%; top:86%;"></div>
    <div class="px9-arrowhead g" style="left:calc(78% - 6px); top:86%;"></div>
    <div class="px9-node onLine" style="left:84%; top:86%;">
      <img src="assets/images/gen2-graphite-refined.png" alt="고순도 정제흑연"><span class="lbl">고순도<br>정제흑연</span>
    </div>

  </div>

  <div class="hdr-page-number">15</div>
</section>
</div>
</body>
</html>
