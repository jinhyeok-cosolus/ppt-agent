<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>15p 7차 테스트(v7) — [솔루션2] 개요 (Flow Diagram Routing 적용)</title>
<!--
  input/15, 16p 테스트용_7.docx 15페이지 제작 지시서(콘텐츠·분기·이미지)만을
  기준으로, 새로 연결된 Layout Routing을 통해 Flow Diagram Layout
  Reference(docs/layout-reference/2026.08.13_ppt_layout_set__V3.pptx L25
  Symmetric Two-Split, 슬라이드 25~26)와 docs/slide-design-rules/
  flow-diagram-rules.md의 반복 표현 규칙을 적용한 독립 테스트(정식
  [1]~[9] 워크플로우 아님, Subagent 미사용, 이전 1~6차 HTML/CSS
  미참조·미재사용 — 클래스명도 새로 작성: px7- 접두사).

  _7 지시서는 이전 차수 대비 라벨 박스("기존공정(1세대)"/"COSOLUS(2세대)")·
  강조문구·색상 HEX·밀도 규칙을 반복하지 않는다 — 이는 이제 Routing으로
  연결된 flow-diagram-rules.md가 공급하는 반복 규칙이기 때문이며, 이번
  테스트가 검증하려는 지점이다. 그래서 이번 슬라이드는:
  - 라벨 박스/강조문구를 임의로 추가하지 않았다(input에 없으므로 Hard Coding
    금지 원칙에 따라 생성하지 않음).
  - 모든 연결을 화살표 도형(화살촉 포함)으로 표시하고 분기 브래킷은 위(빨강)/
    아래(다크그린) 색 분할로 표시했다(flow-diagram-rules.md).
  - 4종 양극재 아이콘은 테두리 없이 이미지만 배치, 결과물 A 아래로 꺾여
    폐흑연으로 향하는 화살표, 1세대/2세대 사이 가로 점선 구분을 적용했다.
  - **가장 중요한 변경**: 지난 세션의 Hard Rule/Design System 검토에서
    Claude_PPT_Design_System.md §3이 "Source/Footnote 제외 모든 텍스트는
    14pt 미만 금지(2026-08-19 확정)"를 규정함을 확인했고, flow-diagram-
    rules.md에도 이를 반영해두었다 — 이전 3~6차 테스트에서 사용했던
    8.6~11pt 라벨 폰트는 이 규정 위반이었으므로, 이번 v7은 모든 라벨을
    14pt Bold 이상으로 적용해 밀도 규칙과 Typography 최소값을 동시에
    만족시켰다.
  - 다크그린 색상은 이번 지시서에 별도 HEX가 없으므로 임의 커스텀 색(예:
    이전 #005151) 대신 Hard Rule §5 Brand Color의 Dark/Main(#034443)을
    그대로 사용했다. 빨강은 Hard Rule에 정의된 토큰이 없어 "명확한 의미가
    필요한 예외적 경우"(Hard Rule §5)에 해당하는 절제된 값(#C0392B)을
    사용했다.
  이미지는 _7.docx의 Word 내부 실제 파일명(image1.png 등)을 rels에서 직접
  추출해 매칭표와 정확히 대조했다(문단 순서 재번호 방식은 지난 세션에서
  4종 양극재 오매칭 버그를 유발했던 방식이라 사용하지 않음). Header는
  Hard Rule §9 그대로 유지.
-->
<style>
  :root {
    --c-dark: #034443;
    --c-ink: #162B1F;
    --c-slate: #5A6664;
    --c-gray: #8C9694;
    --c-submessage: #478689;
    --c-white: #FFFFFF;
    --c-r: #C0392B;
    --c-g: #034443;
    --font-base: "Pretendard", "Malgun Gothic", "맑은 고딕", sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #555; font-family: var(--font-base); color: var(--c-ink); word-break: keep-all; }
  #deck { display: flex; padding: 24px; }
  .slide { position: relative; width: 1280px; height: 720px; background: var(--c-white); overflow: hidden; }

  /* ---------- 공통 Header System (Hard Rule §9, 그대로 유지) ---------- */
  .hdr-ci { position: absolute; left: 64px; top: 25px; height: 20px; }
  .hdr-ci img { height: 20px; width: auto; display: block; }
  .hdr-submessage { position: absolute; right: 64px; top: 25px; font: 500 14pt/20px var(--font-base); color: var(--c-submessage); white-space: nowrap; }
  .hdr-divider { position: absolute; left: 64px; top: 56px; width: 1152px; height: 1px; background: var(--c-submessage); }
  .hdr-section-label { position: absolute; left: 68px; top: 62px; font: 300 12pt var(--font-base); color: var(--c-gray); letter-spacing: 0.06em; text-transform: uppercase; }
  .hdr-main-title { position: absolute; left: 64px; top: 83px; width: 1152px; font: 800 28pt/1.25 var(--font-base); color: var(--c-dark); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .hdr-page-number { position: absolute; right: 44px; bottom: 24px; font: 300 14pt var(--font-base); color: var(--c-gray); }

  .body-box { position: absolute; left: 64px; top: 135px; width: 1152px; height: 521px; padding-top: 16px; }

  /* ================= px7 Flow (flow-diagram-rules.md 반영) ================= */
  .px7-stage { display: flex; width: 100%; height: 100%; gap: 6px; }

  .px7-left { flex: 0 0 172px; display: flex; align-items: center; justify-content: center; }
  .px7-intake { display: flex; align-items: center; width: 100%; }
  .px7-node { display: flex; flex-direction: column; align-items: center; gap: 4px; }
  .px7-node.label-top { flex-direction: column-reverse; }
  .px7-node img { height: 40px; width: auto; max-width: 60px; object-fit: contain; }
  .px7-node .lbl { font: 700 14pt/1.15 var(--font-base); text-align: center; color: var(--c-ink); }
  .lbl.underline { text-decoration: underline; }

  /* 모든 흐름 연결선 = 화살표 도형(화살촉 포함) */
  .px7-arrow-n { flex: 1 1 auto; min-width: 14px; height: 2.5px; background: var(--c-slate); position: relative; margin: 0 3px; }
  .px7-arrow-n::after {
    content: ""; position: absolute; right: -1px; top: 50%; transform: translateY(-50%);
    border-top: 5px solid transparent; border-bottom: 5px solid transparent; border-left: 7px solid var(--c-slate);
  }

  /* 분기 브래킷(구조적 분기선): 상단 절반 빨강 / 하단 절반 다크그린 */
  .px7-right { position: relative; flex: 1; display: flex; flex-direction: column; padding-left: 20px; }
  .px7-bracket-v {
    position: absolute; left: 0; top: 25%; height: 50%; width: 3px;
    background: linear-gradient(to bottom, var(--c-r) 0%, var(--c-r) 50%, var(--c-g) 50%, var(--c-g) 100%);
  }
  .px7-bracket-h { position: absolute; left: 0; width: 16px; height: 3px; }
  .px7-bracket-h.r { top: 25%; background: var(--c-r); }
  .px7-bracket-h.g { top: 75%; background: var(--c-g); }

  .px7-lane { position: relative; flex: 1; display: flex; align-items: center; padding-left: 18px; gap: 10px; }
  .px7-divider-dashed { height: 0; border-top: 2px dashed var(--c-slate); margin: 0 26px; }

  /* 흐름 화살표(카테고리 색 규칙 적용, 폭 채움) */
  .px7-conn { flex: 1 1 auto; min-width: 18px; height: 3px; position: relative; }
  .px7-conn.r { background: var(--c-r); }
  .px7-conn.g { background: var(--c-g); }
  .px7-conn::after {
    content: ""; position: absolute; right: -1px; top: 50%; transform: translateY(-50%);
    border-top: 6px solid transparent; border-bottom: 6px solid transparent; border-left: 9px solid;
  }
  .px7-conn.r::after { border-left-color: var(--c-r); }
  .px7-conn.g::after { border-left-color: var(--c-g); }

  /* -------- 1세대 결과물 (테두리 없이 이미지만) -------- */
  .px7-result-block { display: flex; flex-direction: column; align-items: center; gap: 4px; flex: 0 0 auto; }
  .px7-powrow { display: flex; gap: 8px; }
  .px7-powrow img { width: 36px; height: 30px; object-fit: contain; }
  .px7-result-label { font: 700 14pt var(--font-base); color: var(--c-ink); }
  .px7-bend { color: var(--c-r); font-size: 15px; line-height: 1; font-weight: 800; margin-top: 2px; }
  .px7-byproduct { display: flex; align-items: center; gap: 8px; margin-top: 2px; }
  .px7-byproduct img { height: 28px; width: auto; object-fit: contain; }
  .px7-byproduct span { font: 700 14pt var(--font-base); color: var(--c-slate); }

  /* -------- 2세대 재분기 -------- */
  .px7-subbranch { position: relative; flex: 1; display: flex; flex-direction: column; gap: 8px; padding-left: 16px; }
  .px7-subbranch-v { position: absolute; left: 0; top: 16%; height: 68%; width: 2.5px; background: var(--c-g); }
  .px7-subrow { position: relative; display: flex; align-items: center; gap: 10px; padding-left: 14px; }
  .px7-subrow::before { content: ""; position: absolute; left: 0; top: 50%; width: 12px; height: 2.5px; background: var(--c-g); }

  .px7-resultpair { display: flex; gap: 10px; flex: 0 0 auto; }
</style>
</head>
<body>
<div id="deck">
<section class="slide">
  <div class="hdr-ci"><img src="assets/images/ci-color.png" alt="COSOLUS"></div>
  <div class="hdr-submessage">We promise tomorrow</div>
  <div class="hdr-divider"></div>
  <div class="hdr-section-label">TECHNOLOGY</div>
  <div class="hdr-main-title">[솔루션2] 개요 – 친환경 차세대 배터리 재활용 공정기술 (2세대)</div>

  <div class="body-box">
    <div class="px7-stage">

      <!-- 좌측: 공유 Intake (전기차배터리팩 → 전처리 → 블랙매스), 전부 화살표 도형 -->
      <div class="px7-left">
        <div class="px7-intake">
          <div class="px7-node"><img src="assets/images/start-ev-battery.png" alt="전기차 배터리팩"><span class="lbl">전기차<br>배터리팩</span></div>
          <div class="px7-arrow-n"></div>
          <div class="px7-node"><img src="assets/images/pretreat-icon.png" alt="전처리"><span class="lbl">전처리</span></div>
          <div class="px7-arrow-n"></div>
          <div class="px7-node"><img src="assets/images/blackmass.png" alt="블랙매스"><span class="lbl">블랙매스</span></div>
        </div>
      </div>

      <!-- 우측: 상/하 대칭 분기선(브래킷) + 두 세대 Lane -->
      <div class="px7-right">
        <span class="px7-bracket-v"></span>
        <span class="px7-bracket-h r"></span>
        <span class="px7-bracket-h g"></span>

        <!-- 1세대 Lane (위, 전부 빨강) -->
        <div class="px7-lane">
          <div class="px7-conn r"></div>
          <div class="px7-node label-top"><span class="lbl">용매추출</span><img src="assets/images/gen1-extraction-equip.png" alt="용매추출"></div>
          <div class="px7-conn r"></div>
          <div class="px7-result-block">
            <div class="px7-powrow">
              <img src="assets/images/gen1-mnso4.png" alt="MnSO4">
              <img src="assets/images/gen1-niso4.png" alt="NiSO4">
              <img src="assets/images/gen1-coso4.png" alt="CoSO4">
              <img src="assets/images/gen1-li2co3.png" alt="Li2CO3">
            </div>
            <div class="px7-result-label">재활용 양극재</div>
            <div class="px7-bend">↓</div>
            <div class="px7-byproduct"><img src="assets/images/gen1-waste-graphite.jpeg" alt="폐흑연"><span>폐흑연</span></div>
          </div>
        </div>

        <div class="px7-divider-dashed"></div>

        <!-- 2세대 Lane (아래, 전부 다크그린) -->
        <div class="px7-lane">
          <div class="px7-conn g"></div>
          <div class="px7-node label-top"><span class="lbl underline">부유선별</span><img src="assets/images/gen2-flotation-equip.png" alt="부유선별"></div>
          <div class="px7-conn g"></div>

          <div class="px7-subbranch">
            <span class="px7-subbranch-v"></span>

            <div class="px7-subrow">
              <div class="px7-node"><img src="assets/images/gen2-cathode-blackmass.png" alt="양극재용 블랙매스"><span class="lbl">양극재용<br>블랙매스</span></div>
              <div class="px7-conn g"></div>
              <div class="px7-node label-top"><span class="lbl underline">건식환원</span><img src="assets/images/gen2-dryreduction.png" alt="건식환원"></div>
              <div class="px7-conn g"></div>
              <div class="px7-resultpair">
                <div class="px7-node"><img src="assets/images/gen2-cobalt.png" alt="코발트"><span class="lbl">코발트</span></div>
                <div class="px7-node"><img src="assets/images/gen2-nickel.png" alt="니켈"><span class="lbl">니켈</span></div>
              </div>
            </div>

            <div class="px7-subrow">
              <div class="px7-node"><img src="assets/images/gen2-anode-blackmass.png" alt="음극재용 블랙매스"><span class="lbl">음극재용<br>블랙매스</span></div>
              <div class="px7-conn g"></div>
              <div class="px7-node label-top"><span class="lbl underline">유도가열</span><img src="assets/images/gen2-induction-heat.png" alt="유도가열"></div>
              <div class="px7-conn g"></div>
              <div class="px7-node"><img src="assets/images/gen2-graphite-refined.png" alt="고순도 정제흑연"><span class="lbl">고순도<br>정제흑연</span></div>
            </div>
          </div>
        </div>

      </div>
    </div>
  </div>

  <div class="hdr-page-number">15</div>
</section>
</div>
</body>
</html>
