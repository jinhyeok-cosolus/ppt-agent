<!DOCTYPE html>

<head>

<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background:#555; }
  .slide {
    position: relative;
    width: 1280px;
    height: 720px;
    margin: 20px auto;
    background: #FFFFFF;
    overflow: hidden;
    font-family: 'Pretendard', 'Malgun Gothic', sans-serif;
  }
  .abs { position: absolute; }

  /* ---- Header (Hard Rule §9, 고정) ---- */
  .ci-logo { left:64px; top:25px; height:20px; width:auto; }
  .sub-msg { right:64px; top:25px; font-weight:400; font-size:14pt; color:#478689; }
  .top-divider { left:64px; top:56px; width:1152px; height:1px; background:#478689; }
  .section-label { left:68px; top:62px; font-weight:300; font-size:12pt; color:#8C9694; letter-spacing:0.5px; }

  .page-number { right:64px; top:690px; font-weight:400; font-size:14pt; color:#5A6664; }

  /* ---- Flow canvas ---- */
  #flow { left:64px; top:155px; width:1152px; height:550px; }

  .lbl { font-weight:700; font-size:14pt; color:#0F1E1F; text-align:center; line-height:1.25; width:170px; }
  .lbl-narrow { font-weight:700; font-size:14pt; color:#0F1E1F; text-align:center; line-height:1.25; width:110px; }

  .h-line { height:2px; }
  .v-line { width:2px; }

  .arrow-r { width:0; height:0; border-top:6px solid transparent; border-bottom:6px solid transparent; border-left:9px solid; }
  .arrow-d { width:0; height:0; border-left:6px solid transparent; border-right:6px solid transparent; border-top:9px solid; }

  .divider-dashed { border-top: 1px dashed #C7CFCD; height:0; }
</style>
</head>
<body>
<div class="slide">

  <!-- ================= Header (Hard Rule §9) ================= -->
  <img class="abs ci-logo" src="assets/images/ci-color.png" alt="COSOLUS CI">

  <div class="abs page-number">15</div>

  <!-- ================= Flow Diagram ================= -->
  <div class="abs" id="flow">

    <div class="abs divider-dashed" style="left:415px; top:255px; width:737px;"></div>

    <img class="abs" src="assets/images/start-ev-battery.png" style="left:14px; top:182px; height:56px; width:auto;">

    <div class="abs h-line" style="left:107px; top:209px; width:157px; background:#5A6664;"></div>
    <div class="abs arrow-r" style="left:264px; top:204px; border-left-color:#5A6664;"></div>

    <div class="abs h-line" style="left:362px; top:209px; width:53px; background:#5A6664;"></div>

    <!-- ============ 2) 1차 Branch Point (X=415) ============ -->
    <!-- 세로 브래킷: 상단(Y95~210) Red / 하단(Y210~355) Green, 분할 지점 Y210 -->
    <div class="abs v-line" style="left:414px; top:95px; height:115px; background:#C0392B;"></div>
    <div class="abs v-line" style="left:414px; top:210px; height:145px; background:#034443;"></div>

    <div class="abs h-line" style="left:445px; top:94px; width:235px; background:#C0392B;"></div>

    <div class="abs h-line" style="left:680px; top:94px; width:154px; background:#C0392B;"></div>
    <div class="abs arrow-r" style="left:834px; top:89px; border-left-color:#C0392B;"></div>

    <!-- (b) 하향: 폐흑연 진입 직전까지, 화살표로 노드 진입 -->
    <div class="abs h-line" style="left:680px; top:189px; width:320px; background:#C0392B;"></div>
    <div class="abs arrow-r" style="left:1000px; top:184px; border-left-color:#C0392B;"></div>

    <!-- Output Group: 재활용 양극재 (4종, 하나의 Node로 인식되도록 촘촘히 배치) -->
    <img class="abs" src="assets/images/gen1-mnso4.png"  style="left:850px; top:73px; height:44px; width:auto;">

    <div class="abs h-line" style="left:445px; top:354px; width:143px; background:#034443;"></div>

    <!-- Process: 부유선별 -->
    <div class="abs lbl" style="left:431px; top:275px; width:170px;">부유선별</div>
    <img class="abs" src="assets/images/gen2-flotation-equip.png" style="left:481px; top:303px; height:44px; width:auto;">

    <!-- ============ 5) 2차(내부) Branch Point (X=588) ============ -->
    <div class="abs v-line" style="left:587px; top:355px; height:110px; background:#034443;"></div>

    <!-- Node: 양극재용 블랙매스 (Intermediate) -->

    <div class="abs h-line" style="left:681px; top:354px; width:298px; background:#034443;"></div>
    <div class="abs arrow-r" style="left:979px; top:349px; border-left-color:#034443;"></div>

    <!-- Process: 건식환원 -->
    <div class="abs lbl" style="left:745px; top:275px; width:170px;">건식환원</div>
    <img class="abs" src="assets/images/gen2-dryreduction.png" style="left:808px; top:303px; height:44px; width:auto;">

    <img class="abs" src="assets/images/gen2-cobalt.png" style="left:994px; top:331px; height:48px; width:auto;">

    <div class="abs lbl-narrow" style="left:990px; top:387px; width:56px;">코발트</div>

    <!-- 5-B) 하향: 음극재용 블랙매스 경로 -->
    <div class="abs h-line" style="left:588px; top:464px; width:13px; background:#034443;"></div>
    <div class="abs arrow-r" style="left:601px; top:459px; border-left-color:#034443;"></div>

    <!-- Node: 음극재용 블랙매스 (Intermediate) -->
    <img class="abs" src="assets/images/gen2-anode-blackmass.png" style="left:616px; top:439px; height:52px; width:auto;">
    <div class="abs lbl" style="left:570px; top:499px; width:170px;">음극재용 블랙매스</div>

    <!-- Connector: 블랙매스 -> 정제흑연 (연속, 유도가열 Process 위에 얹힘) -->
    <div class="abs h-line" style="left:694px; top:464px; width:319px; background:#034443;"></div>
    <div class="abs arrow-r" style="left:1013px; top:459px; border-left-color:#034443;"></div>

    <div class="abs lbl" style="left:979px; top:497px; width:170px;">고순도 정제흑연</div>
