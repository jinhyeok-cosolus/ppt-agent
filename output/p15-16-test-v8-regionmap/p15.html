<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>15p Region Map 적용 재테스트(v8) — [솔루션2] 개요</title>
<!--
  input/15, 16p 테스트용_7.docx와 동일한 콘텐츠·이미지를 사용하되, 이번에는
  flow-diagram-rules.md에 새로 추가된 "Region Map(비율 기준)" 표를 실제
  공간 배치의 필수 기준으로 적용한 재테스트다(정식 [1]~[9] 워크플로우
  아님, Subagent 미사용, v7의 HTML/CSS 배치값은 재사용하지 않고 새로
  작성: px8- 접두사, flex 자동배치 대신 Region Map %를 직접 좌표로 사용).

  적용한 Region Map 값(flow-diagram-rules.md §0):
  - 공통 시작 영역: X 0~35%
  - 1차 분기점(브래킷) X: 35%
  - 상단 Lane(1세대): Y 0~47%
  - 하단 Lane(2세대): Y 47~100%
  - 2세대 내부 재분기점 X: 52%
  - 결과물 영역: X 70%~100%에서 시작
  모든 값은 .body-box(1152×521px, Hard Rule §9)를 기준으로 한 %이며,
  v7처럼 flexbox가 콘텐츠 양에 따라 자동으로 폭/위치를 재배치하지 않고
  위 좌표를 절대(%) 기준으로 직접 지정했다 — 이번 테스트가 검증하려는
  지점(Region Map이 실제로 배치를 강제하는지)이다. 색상(#C0392B/#034443
  브랜드 Dark), Connector(화살표 도형+화살촉), Typography(14pt Bold
  이상), 아이콘 무테두리, 점선 구분선 등 표현 규칙은 v7과 동일하게
  flow-diagram-rules.md를 따랐다(규칙 자체는 이번에 변경되지 않음).
  이미지는 v7과 동일 원본(input _7.docx, Word 내부 실제 파일명 기준
  추출)을 그대로 재사용했다(신규 이미지 없음). Header는 Hard Rule §9
  그대로 유지.
-->
<style>
  :root {
    --c-dark: #034443;
    --c-ink: #162B1F;
    --c-slate: #5A6664;
    --c-gray: #8C9694;
    --c-submessage: #478689;
    --c-white: #FFFFFF;
    --c-r: #C0392B;
    --c-g: #034443;
    --font-base: "Pretendard", "Malgun Gothic", "맑은 고딕", sans-serif;
    /* Region Map 상수 (flow-diagram-rules.md §0) */
    --branch-x: 35%;
    --subbranch-x: 52%;
    --result-x: 70%;
    --lane-y: 47%;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #555; font-family: var(--font-base); color: var(--c-ink); word-break: keep-all; }
  #deck { display: flex; padding: 24px; }
  .slide { position: relative; width: 1280px; height: 720px; background: var(--c-white); overflow: hidden; }

  /* ---------- 공통 Header System (Hard Rule §9, 그대로 유지) ---------- */
  .hdr-ci { position: absolute; left: 64px; top: 25px; height: 20px; }
  .hdr-ci img { height: 20px; width: auto; display: block; }
  .hdr-submessage { position: absolute; right: 64px; top: 25px; font: 500 14pt/20px var(--font-base); color: var(--c-submessage); white-space: nowrap; }
  .hdr-divider { position: absolute; left: 64px; top: 56px; width: 1152px; height: 1px; background: var(--c-submessage); }
  .hdr-section-label { position: absolute; left: 68px; top: 62px; font: 300 12pt var(--font-base); color: var(--c-gray); letter-spacing: 0.06em; text-transform: uppercase; }
  .hdr-main-title { position: absolute; left: 64px; top: 83px; width: 1152px; font: 800 28pt/1.25 var(--font-base); color: var(--c-dark); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .hdr-page-number { position: absolute; right: 44px; bottom: 24px; font: 300 14pt var(--font-base); color: var(--c-gray); }

  /* Body Box(Hard Rule §9) = Region Map의 100% 기준 */
  .body-box { position: absolute; left: 64px; top: 135px; width: 1152px; height: 521px; }

  .px8-node { position: absolute; display: flex; flex-direction: column; align-items: center; gap: 4px; }
  .px8-node.label-top { flex-direction: column-reverse; }
  .px8-node img { height: 42px; width: auto; max-width: 64px; object-fit: contain; }
  .px8-node .lbl { font: 700 14pt/1.15 var(--font-base); text-align: center; color: var(--c-ink); white-space: nowrap; }
  .lbl.underline { text-decoration: underline; }

  /* ---- 화살표 도형(선+화살촉), 절대좌표로 두 점 사이를 잇는 가로선 ---- */
  .px8-arrow { position: absolute; height: 3px; }
  .px8-arrow::after {
    content: ""; position: absolute; right: -1px; top: 50%; transform: translateY(-50%);
    border-top: 6px solid transparent; border-bottom: 6px solid transparent; border-left: 9px solid;
  }
  .px8-arrow.neutral { background: var(--c-slate); }
  .px8-arrow.neutral::after { border-left-color: var(--c-slate); }
  .px8-arrow.r { background: var(--c-r); }
  .px8-arrow.r::after { border-left-color: var(--c-r); }
  .px8-arrow.g { background: var(--c-g); }
  .px8-arrow.g::after { border-left-color: var(--c-g); }

  /* ---- 1차 분기 브래킷: X=35%, 상단 절반 빨강/하단 절반 다크그린 ---- */
  .px8-bracket-v {
    position: absolute; left: var(--branch-x); top: 23%; height: 50%; width: 3px;
    background: linear-gradient(to bottom, var(--c-r) 0%, var(--c-r) 50%, var(--c-g) 50%, var(--c-g) 100%);
  }
  .px8-bracket-h { position: absolute; left: var(--branch-x); width: 14px; height: 3px; }
  .px8-bracket-h.r { top: 23%; background: var(--c-r); }
  .px8-bracket-h.g { top: 73%; background: var(--c-g); }

  /* ---- 2세대 내부 재분기 브래킷: X=52% ---- */
  .px8-subbracket-v { position: absolute; left: var(--subbranch-x); top: 60%; height: 26%; width: 2.5px; background: var(--c-g); }
  .px8-subbracket-h { position: absolute; left: var(--subbranch-x); width: 12px; height: 2.5px; background: var(--c-g); }

  /* ---- 1세대 결과물(재활용 양극재 4종, 테두리 없음) ---- */
  .px8-powrow { position: absolute; display: flex; gap: 8px; }
  .px8-powrow img { width: 36px; height: 30px; object-fit: contain; }
  .px8-result-label { position: absolute; font: 700 14pt var(--font-base); color: var(--c-ink); white-space: nowrap; }
  .px8-bend { position: absolute; color: var(--c-r); font-size: 16px; font-weight: 800; }
  .px8-byproduct { position: absolute; display: flex; align-items: center; gap: 8px; }
  .px8-byproduct img { height: 28px; width: auto; object-fit: contain; }
  .px8-byproduct span { font: 700 14pt var(--font-base); color: var(--c-slate); white-space: nowrap; }

  /* ---- 1세대/2세대 사이 가로 점선(Y=47%, 결과물 영역 제외 폭) ---- */
  .px8-divider-dashed { position: absolute; left: var(--branch-x); right: 2%; top: var(--lane-y); height: 0; border-top: 2px dashed var(--c-slate); }
</style>
</head>
<body>
<div id="deck">
<section class="slide">
  <div class="hdr-ci"><img src="assets/images/ci-color.png" alt="COSOLUS"></div>
  <div class="hdr-submessage">We promise tomorrow</div>
  <div class="hdr-divider"></div>
  <div class="hdr-section-label">TECHNOLOGY</div>
  <div class="hdr-main-title">[솔루션2] 개요 – 친환경 차세대 배터리 재활용 공정기술 (2세대)</div>

  <div class="body-box">

    <!-- ===== 공통 시작 영역: X 0~35% ===== -->
    <div class="px8-node" style="left:0%; top:44%;">
      <img src="assets/images/start-ev-battery.png" alt="전기차 배터리팩"><span class="lbl">전기차<br>배터리팩</span>
    </div>
    <div class="px8-arrow neutral" style="left:9%; width:6%; top:50%;"></div>
    <div class="px8-node" style="left:16%; top:47%;">
      <img src="assets/images/pretreat-icon.png" alt="전처리"><span class="lbl">전처리</span>
    </div>
    <div class="px8-arrow neutral" style="left:22%; width:6%; top:50%;"></div>
    <div class="px8-node" style="left:29%; top:44%;">
      <img src="assets/images/blackmass.png" alt="블랙매스"><span class="lbl">블랙매스</span>
    </div>

    <!-- ===== 1차 분기점: X=35% ===== -->
    <span class="px8-bracket-v"></span>
    <span class="px8-bracket-h r"></span>
    <span class="px8-bracket-h g"></span>

    <!-- ===== 상단 Lane(1세대): Y 0~47%, 전부 빨강 ===== -->
    <div class="px8-arrow r" style="left:35.6%; width:6%; top:23%;"></div>
    <div class="px8-node label-top" style="left:43%; top:15%;">
      <span class="lbl">용매추출</span><img src="assets/images/gen1-extraction-equip.png" alt="용매추출">
    </div>
    <div class="px8-arrow r" style="left:49%; width:20%; top:23%;"></div>

    <!-- 결과물 영역: X 70%~100% -->
    <div class="px8-powrow" style="left:70%; top:8%;">
      <img src="assets/images/gen1-mnso4.png" alt="MnSO4">
      <img src="assets/images/gen1-niso4.png" alt="NiSO4">
      <img src="assets/images/gen1-coso4.png" alt="CoSO4">
      <img src="assets/images/gen1-li2co3.png" alt="Li2CO3">
    </div>
    <div class="px8-result-label" style="left:70%; top:20%;">재활용 양극재</div>
    <div class="px8-bend" style="left:74%; top:26%;">↓</div>
    <div class="px8-byproduct" style="left:70%; top:35%;">
      <img src="assets/images/gen1-waste-graphite.jpeg" alt="폐흑연"><span>폐흑연</span>
    </div>

    <!-- ===== 1세대/2세대 구분 점선: Y=47% ===== -->
    <span class="px8-divider-dashed"></span>

    <!-- ===== 하단 Lane(2세대): Y 47~100%, 전부 다크그린 ===== -->
    <div class="px8-arrow g" style="left:35.6%; width:6%; top:73%;"></div>
    <div class="px8-node label-top" style="left:43%; top:65%;">
      <span class="lbl underline">부유선별</span><img src="assets/images/gen2-flotation-equip.png" alt="부유선별">
    </div>
    <div class="px8-arrow g" style="left:49%; width:3%; top:73%;"></div>

    <!-- ===== 2세대 내부 재분기: X=52% ===== -->
    <span class="px8-subbracket-v"></span>
    <span class="px8-subbracket-h" style="top:60%;"></span>
    <span class="px8-subbracket-h" style="top:86%;"></span>

    <!-- 재분기 위: 양극재용 블랙매스 → 건식환원 → 코발트·니켈 -->
    <div class="px8-arrow g" style="left:52.5%; width:3%; top:60%;"></div>
    <div class="px8-node" style="left:56%; top:57%;">
      <img src="assets/images/gen2-cathode-blackmass.png" alt="양극재용 블랙매스"><span class="lbl">양극재용<br>블랙매스</span>
    </div>
    <div class="px8-arrow g" style="left:62%; width:5.5%; top:60%;"></div>
    <div class="px8-node label-top" style="left:68%; top:53%;">
      <span class="lbl underline">건식환원</span><img src="assets/images/gen2-dryreduction.png" alt="건식환원">
    </div>
    <div class="px8-arrow g" style="left:79%; width:3%; top:60%;"></div>
    <div class="px8-node" style="left:82.5%; top:57%;">
      <img src="assets/images/gen2-cobalt.png" alt="코발트"><span class="lbl">코발트</span>
    </div>
    <div class="px8-node" style="left:91%; top:57%;">
      <img src="assets/images/gen2-nickel.png" alt="니켈"><span class="lbl">니켈</span>
    </div>

    <!-- 재분기 아래: 음극재용 블랙매스 → 유도가열 → 고순도 정제흑연 -->
    <div class="px8-arrow g" style="left:52.5%; width:3%; top:86%;"></div>
    <div class="px8-node" style="left:56%; top:83%;">
      <img src="assets/images/gen2-anode-blackmass.png" alt="음극재용 블랙매스"><span class="lbl">음극재용<br>블랙매스</span>
    </div>
    <div class="px8-arrow g" style="left:62%; width:5.5%; top:86%;"></div>
    <div class="px8-node label-top" style="left:68%; top:79%;">
      <span class="lbl underline">유도가열</span><img src="assets/images/gen2-induction-heat.png" alt="유도가열">
    </div>
    <div class="px8-arrow g" style="left:79%; width:3%; top:86%;"></div>
    <div class="px8-node" style="left:82.5%; top:83%;">
      <img src="assets/images/gen2-graphite-refined.png" alt="고순도 정제흑연"><span class="lbl">고순도<br>정제흑연</span>
    </div>

  </div>

  <div class="hdr-page-number">15</div>
</section>
</div>
</body>
</html>
