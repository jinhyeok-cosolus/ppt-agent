<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>15p Output Group 판별 적용 재테스트(v12)</title>
<!--
  input/15, 16p 테스트용_7.docx와 동일 콘텐츠·이미지. v11 이하 HTML/CSS
  구현은 재사용하지 않고 새로 작성했다(px12- 접두사). flow-diagram-
  rules.md의 "Flow Graph 선해석 및 Connector 생성 원칙" 절차를 다시
  적용해 아래처럼 Flow Graph를 확정하고, 특히 6번(Output 관계 판별)을
  좌표 배치 전에 먼저 수행했다:

  [Material/Input] 전기차배터리팩
    →[Process] 전처리 →[Intermediate] 블랙매스
    →[Branch Point 1, Region Map 1차 분기 X=35%]
      ├─[Process] 용매추출
      │   → 결과물 2종 판별: "재활용 양극재(4종)"는 동일 카테고리·동일
      │     위계·후속 Process 없음 → Output Group(그룹 내부 Branch 없음).
      │     "폐흑연"은 폐기물로 별도 목적지·의미적으로 독립된 결과 →
      │     이 둘은 서로 다른 종류의 결과물 → Branch Point 3(Sibling
      │     Outputs)에서 [재활용양극재 Output Group] / [폐흑연] 두 갈래로
      │     분기(Output Group 자체는 분기 대상이 아니라 Sibling Branch의
      │     한쪽 목적지일 뿐 — Group 판정과 Sibling 분기는 서로 다른
      │     레벨이라 충돌하지 않는다).
      └─[Process] 부유선별
          →[Branch Point 2, Region Map 2차 재분기 X=52%]
            ├─[Intermediate] 양극재용 블랙매스 →[Process] 건식환원
            │   → 결과물 2종 판별: "코발트"/"니켈"은 동일 카테고리(회수
            │     금속)·동일 위계이고 둘 다 별도 후속 Process로 이어지지
            │     않음 → **Output Group**으로 판정(v11까지는 Sibling
            │     Branch로 잘못 분기했던 부분 — 이번에 규칙대로 단일
            │     Connector로 그룹 전체를 연결하고 내부 Branch 제거).
            └─[Intermediate] 음극재용 블랙매스 →[Process] 유도가열 →[Output] 고순도 정제흑연(단일)

  Material→Process→Material 전/후 Connector 연속성, Branch Point의 단일
  Fork Spine 구조(공유 Trunk→단일 지점→복수 Branch), Node-Connector
  완전 비중첩(이미지 포함, Bounding Box 외곽에서 종료 후 재시작), 동일
  위계 Node 이미지 체감 크기 유지(과도한 축소 금지)는 v11에서 검증된
  구조를 그대로 유지했다. Region Map(1차 35%/2차 52%/결과물 70%/Lane
  경계 47%), 색상(#C0392B/#034443)·Typography(14pt Bold 이상)·아이콘
  무테두리·점선 구분선 규칙 변경 없음. 이미지는 v7과 동일 원본 재사용.
  Header는 Hard Rule §9 그대로.
-->
<style>
  :root {
    --c-dark: #034443; --c-ink: #162B1F; --c-slate: #5A6664; --c-gray: #8C9694;
    --c-submessage: #478689; --c-white: #FFFFFF; --c-r: #C0392B; --c-g: #034443;
    --font-base: "Pretendard", "Malgun Gothic", "맑은 고딕", sans-serif;
    --branch-x: 35%; --subbranch-x: 52%; --result-x: 70%; --lane-y: 47%;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #555; font-family: var(--font-base); color: var(--c-ink); word-break: keep-all; }
  #deck { display: flex; padding: 24px; }
  .slide { position: relative; width: 1280px; height: 720px; background: var(--c-white); overflow: hidden; }

  .hdr-ci { position: absolute; left: 64px; top: 25px; height: 20px; }
  .hdr-ci img { height: 20px; width: auto; display: block; }
  .hdr-submessage { position: absolute; right: 64px; top: 25px; font: 500 14pt/20px var(--font-base); color: var(--c-submessage); white-space: nowrap; }
  .hdr-divider { position: absolute; left: 64px; top: 56px; width: 1152px; height: 1px; background: var(--c-submessage); }
  .hdr-section-label { position: absolute; left: 68px; top: 62px; font: 300 12pt var(--font-base); color: var(--c-gray); letter-spacing: 0.06em; text-transform: uppercase; }
  .hdr-main-title { position: absolute; left: 64px; top: 83px; width: 1152px; font: 800 28pt/1.25 var(--font-base); color: var(--c-dark); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .hdr-page-number { position: absolute; right: 44px; bottom: 24px; font: 300 14pt var(--font-base); color: var(--c-gray); }

  .body-box { position: absolute; left: 64px; top: 135px; width: 1152px; height: 521px; }

  /* ---- Process Node: 라벨→이미지가 Connector 위쪽에, Connector는 아래로 연속 ---- */
  .px12-proc { position: absolute; display: flex; flex-direction: column-reverse; align-items: center; gap: 4px; transform: translate(-50%, 0); }
  .px12-proc img { height: 40px; width: auto; max-width: 60px; object-fit: contain; }
  .px12-proc .lbl { font: 700 14pt/1.15 var(--font-base); text-align: center; color: var(--c-ink); white-space: nowrap; }

  /* ---- Material/Intermediate/Output Node: 이미지만 Connector 중심, 라벨은 고정 px Gap 아래(비관통) ---- */
  .px12-mat-icon { position: absolute; transform: translate(-50%, -50%); height: 40px; width: auto; max-width: 60px; object-fit: contain; }
  .px12-mat-label { position: absolute; transform: translate(-50%, 0); font: 700 14pt/1.15 var(--font-base); text-align: center; color: var(--c-ink); white-space: nowrap; margin-top: 28px; }

  .lbl.underline { text-decoration: underline; }

  .px12-line { position: absolute; height: 3px; }
  .px12-line.neutral { background: var(--c-slate); }
  .px12-line.r { background: var(--c-r); }
  .px12-line.g { background: var(--c-g); }
  .px12-arrowhead { position: absolute; width: 0; height: 0; border-top: 6px solid transparent; border-bottom: 6px solid transparent; border-left: 9px solid; transform: translateY(-50%); }
  .px12-arrowhead.neutral { border-left-color: var(--c-slate); }
  .px12-arrowhead.r { border-left-color: var(--c-r); }
  .px12-arrowhead.g { border-left-color: var(--c-g); }

  /* ---- Region Map Branch Point 1/2: 단일 Fork Spine ---- */
  .px12-bracket-v {
    position: absolute; left: var(--branch-x); top: 20%; height: 53%; width: 3px;
    background: linear-gradient(to bottom, var(--c-r) 0%, var(--c-r) 50%, var(--c-g) 50%, var(--c-g) 100%);
  }
  .px12-subbracket-v { position: absolute; left: var(--subbranch-x); top: 60%; height: 26%; width: 2.5px; background: var(--c-g); }

  /* ---- Sibling Outputs Branch Point(용매추출 전용, 재활용양극재 Group ↔ 폐흑연): 단일 Fork Spine ---- */
  .px12-fork-v { position: absolute; width: 2.5px; background: var(--c-r); }
  .px12-fork-dot { position: absolute; width: 6px; height: 6px; border-radius: 50%; background: var(--c-r); transform: translate(-50%, -50%); }

  .px12-result-label { position: absolute; font: 700 14pt var(--font-base); color: var(--c-ink); white-space: nowrap; transform: translate(-50%, 0); }
  .px12-powrow { position: absolute; display: flex; gap: 8px; transform: translate(-50%, 0); }
  .px12-powrow img { width: 36px; height: 30px; object-fit: contain; }

  /* ---- Output Group(코발트+니켈): 그룹 내부는 촘촘한 Gap, Branch 없이 단일 Connector로 연결 ---- */
  .px12-outgroup { position: absolute; display: flex; gap: 14px; transform: translate(-50%, -50%); align-items: flex-start; }
  .px12-outgroup-item { display: flex; flex-direction: column; align-items: center; gap: 4px; }
  .px12-outgroup-item img { height: 40px; width: auto; max-width: 56px; object-fit: contain; }
  .px12-outgroup-item .lbl { font: 700 14pt/1.15 var(--font-base); color: var(--c-ink); white-space: nowrap; }

  .px12-divider-dashed { position: absolute; left: var(--branch-x); right: 2%; top: var(--lane-y); height: 0; border-top: 2px dashed var(--c-slate); }
</style>
</head>
<body>
<div id="deck">
<section class="slide">
  <div class="hdr-ci"><img src="assets/images/ci-color.png" alt="COSOLUS"></div>
  <div class="hdr-submessage">We promise tomorrow</div>
  <div class="hdr-divider"></div>
  <div class="hdr-section-label">TECHNOLOGY</div>
  <div class="hdr-main-title">[솔루션2] 개요 – 친환경 차세대 배터리 재활용 공정기술 (2세대)</div>

  <div class="body-box">

    <!-- ===== [Material]전기차배터리팩 →[Process]전처리→ [Intermediate]블랙매스 : Trunk Y=47% ===== -->
    <div class="px12-line neutral" style="left:3%; width:32%; top:47%;"></div>
    <img class="px12-mat-icon" style="left:4%; top:47%;" src="assets/images/start-ev-battery.png" alt="전기차 배터리팩">
    <div class="px12-mat-label" style="left:4%; top:47%;">전기차<br>배터리팩</div>

    <div class="px12-proc" style="left:17%; top:33%;">
      <img src="assets/images/pretreat-icon.png" alt="전처리"><span class="lbl">전처리</span>
    </div>

    <img class="px12-mat-icon" style="left:30%; top:47%;" src="assets/images/blackmass.png" alt="블랙매스">
    <div class="px12-mat-label" style="left:30%; top:47%;">블랙매스</div>
    <div class="px12-arrowhead neutral" style="left:calc(35% - 6px); top:47%;"></div>

    <!-- ===== Branch Point 1 (Region Map 1차 분기 X=35%): 단일 Fork Spine, 상(빨강)/하(다크그린) ===== -->
    <span class="px12-bracket-v"></span>

    <!-- ===== 상단 갈래: [Process]용매추출 (Trunk Y=20%, 전부 빨강) ===== -->
    <div class="px12-line r" style="left:35%; width:9%; top:20%;"></div>
    <div class="px12-proc" style="left:44%; top:9%;">
      <img src="assets/images/gen1-extraction-equip.png" alt="용매추출"><span class="lbl">용매추출</span>
    </div>
    <div class="px12-line r" style="left:44%; width:20%; top:20%;"></div>
    <div class="px12-arrowhead r" style="left:calc(64% - 6px); top:20%;"></div>

    <!-- Branch Point 3 (Sibling Outputs 판별 결과: 재활용양극재 Output Group ↔ 폐흑연, X=64%) -->
    <span class="px12-fork-dot" style="left:64%; top:20%;"></span>
    <span class="px12-fork-v" style="left:64%; top:8%; height:24%;"></span>

    <!-- Sibling A: 재활용 양극재 = Output Group(내부 Branch 없음, 단일 목적지) -->
    <div class="px12-line r" style="left:64%; width:6%; top:8%;"></div>
    <div class="px12-arrowhead r" style="left:calc(70% - 6px); top:8%;"></div>
    <div class="px12-powrow" style="left:85%; top:1%;">
      <img src="assets/images/gen1-mnso4.png" alt="MnSO4">
      <img src="assets/images/gen1-niso4.png" alt="NiSO4">
      <img src="assets/images/gen1-coso4.png" alt="CoSO4">
      <img src="assets/images/gen1-li2co3.png" alt="Li2CO3">
    </div>
    <div class="px12-result-label" style="left:85%; top:13%;">재활용 양극재</div>

    <!-- Sibling B: 폐흑연(별도 목적지) -->
    <div class="px12-line r" style="left:64%; width:6%; top:32%;"></div>
    <div class="px12-arrowhead r" style="left:calc(70% - 6px); top:32%;"></div>
    <img class="px12-mat-icon" style="left:78%; top:32%; height:28px;" src="assets/images/gen1-waste-graphite.jpeg" alt="폐흑연">
    <div class="px12-result-label" style="left:78%; top:32%; margin-top:22px;">폐흑연</div>

    <!-- ===== Lane 경계 점선(Y=47%) ===== -->
    <span class="px12-divider-dashed"></span>

    <!-- ===== 하단 갈래: [Process]부유선별 (Trunk Y=73%, 전부 다크그린) ===== -->
    <div class="px12-line g" style="left:35%; width:9%; top:73%;"></div>
    <div class="px12-proc" style="left:44%; top:62%;">
      <img src="assets/images/gen2-flotation-equip.png" alt="부유선별"><span class="lbl underline">부유선별</span>
    </div>
    <div class="px12-line g" style="left:44%; width:8%; top:73%;"></div>
    <div class="px12-arrowhead g" style="left:calc(52% - 6px); top:73%;"></div>

    <!-- ===== Branch Point 2 (Region Map 2차 재분기 X=52%): 단일 Fork Spine ===== -->
    <span class="px12-subbracket-v"></span>

    <!-- ---- 하위 경로1: [Intermediate]양극재용 블랙매스 →[Process]건식환원 →[Output Group]코발트+니켈 : Trunk Y=60% ---- -->
    <div class="px12-line g" style="left:52%; width:6%; top:60%;"></div>
    <img class="px12-mat-icon" style="left:58%; top:60%;" src="assets/images/gen2-cathode-blackmass.png" alt="양극재용 블랙매스">
    <div class="px12-mat-label" style="left:58%; top:60%;">양극재용<br>블랙매스</div>
    <div class="px12-line g" style="left:58%; width:6%; top:60%;"></div>
    <div class="px12-proc" style="left:64%; top:49%;">
      <img src="assets/images/gen2-dryreduction.png" alt="건식환원"><span class="lbl underline">건식환원</span>
    </div>
    <!-- 판별: 코발트/니켈 = 동일 카테고리·동일 위계·후속 Process 없음 → Output Group. 내부 Branch 없이 단일 Connector로 그룹 전체 연결 -->
    <div class="px12-line g" style="left:64%; width:16%; top:60%;"></div>
    <div class="px12-arrowhead g" style="left:calc(80% - 6px); top:60%;"></div>
    <div class="px12-outgroup" style="left:88%; top:60%;">
      <div class="px12-outgroup-item"><img src="assets/images/gen2-cobalt.png" alt="코발트"><span class="lbl">코발트</span></div>
      <div class="px12-outgroup-item"><img src="assets/images/gen2-nickel.png" alt="니켈"><span class="lbl">니켈</span></div>
    </div>

    <!-- ---- 하위 경로2: [Intermediate]음극재용 블랙매스 →[Process]유도가열 →[Output]고순도 정제흑연(단일) : Trunk Y=86% ---- -->
    <div class="px12-line g" style="left:52%; width:6%; top:86%;"></div>
    <img class="px12-mat-icon" style="left:58%; top:86%;" src="assets/images/gen2-anode-blackmass.png" alt="음극재용 블랙매스">
    <div class="px12-mat-label" style="left:58%; top:86%;">음극재용<br>블랙매스</div>
    <div class="px12-line g" style="left:58%; width:6%; top:86%;"></div>
    <div class="px12-proc" style="left:64%; top:75%;">
      <img src="assets/images/gen2-induction-heat.png" alt="유도가열"><span class="lbl underline">유도가열</span>
    </div>
    <div class="px12-line g" style="left:64%; width:14%; top:86%;"></div>
    <div class="px12-arrowhead g" style="left:calc(78% - 6px); top:86%;"></div>
    <img class="px12-mat-icon" style="left:84%; top:86%;" src="assets/images/gen2-graphite-refined.png" alt="고순도 정제흑연">
    <div class="px12-mat-label" style="left:84%; top:86%;">고순도<br>정제흑연</div>

  </div>

  <div class="hdr-page-number">15</div>
</section>
</div>
</body>
</html>
