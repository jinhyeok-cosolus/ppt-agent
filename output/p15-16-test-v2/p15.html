<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>15p 재테스트(v2) — [솔루션2] 개요 (1세대/2세대 공정 비교)</title>
<!--
  input/15, 16p 테스트용_2.docx 15페이지 제작 지시서를 그대로 반영한 재테스트
  HTML(정식 [1]~[9] 워크플로우 아님, Subagent 미사용, Material Analysis/전체
  QA 생략). 이전 output/p15-16-test/p15.html의 레이아웃·클래스 구조는 참고하지
  않고 새로 구성했다. _2 지시서가 명시한 구조를 그대로 따름: 블랙매스 지점에서
  오른쪽으로 뻗는 세로 분기선(브래킷)이 위(1세대)/아래(2세대)로 갈라지고,
  블랙매스 바로 아래에는 별도로 "기존공정(1세대)"(빨강)/"COSOLUS(2세대)"
  (다크그린 #005151, 지시서 명시 색상) 라벨 박스를 세로로 배치. 1세대 결과물은
  양극재4종(공통 라벨)+아래로 꺾여 폐흑연, 두 세대 사이는 가로 점선으로 구분,
  2세대는 부유선별 이후 다시 위/아래로 재분기. 이미지는 원본 docx에 첨부된
  이미지를 그대로 사용(신규 이미지 생성 없음). 슬라이드 제목이 강조 메시지를
  포함해 설명을 이미 충분히 전달하고, 강조 텍스트(경제성/친환경성/양산성)는
  지시서상 도식 내부(COSOLUS 박스 아래)에 위치가 명시되어 있어 Header
  Supporting Message는 이번 슬라이드에서 생략했다(Hard Rule §12 예외 ②).
-->
<style>
  :root {
    --c-primary: #067875;
    --c-dark: #034443;
    --c-ink: #162B1F;
    --c-slate: #5A6664;
    --c-gray: #8C9694;
    --c-submessage: #478689;
    --c-white: #FFFFFF;
    --c-red: #C23B2E;
    --c-red-tint: #FBF1EF;
    --c-green: #005151;
    --c-green-tint: #EEF5F4;
    --font-base: "Pretendard", "Malgun Gothic", "맑은 고딕", sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #555; font-family: var(--font-base); color: var(--c-ink); word-break: keep-all; }
  #deck { display: flex; padding: 24px; }
  .slide { position: relative; width: 1280px; height: 720px; background: var(--c-white); overflow: hidden; }

  /* ---------- 공통 Header System (Hard Rule §9, 그대로 유지) ---------- */
  .hdr-ci { position: absolute; left: 64px; top: 25px; height: 20px; }
  .hdr-ci img { height: 20px; width: auto; display: block; }
  .hdr-submessage { position: absolute; right: 64px; top: 25px; font: 500 14pt/20px var(--font-base); color: var(--c-submessage); white-space: nowrap; }
  .hdr-divider { position: absolute; left: 64px; top: 56px; width: 1152px; height: 1px; background: var(--c-submessage); }
  .hdr-section-label { position: absolute; left: 68px; top: 62px; font: 300 12pt var(--font-base); color: var(--c-gray); letter-spacing: 0.06em; text-transform: uppercase; }
  .hdr-main-title { position: absolute; left: 64px; top: 83px; width: 1152px; font: 800 28pt/1.25 var(--font-base); color: var(--c-dark); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .hdr-page-number { position: absolute; right: 44px; bottom: 24px; font: 300 14pt var(--font-base); color: var(--c-gray); }

  /* Body Box — Hard Rule §9 (Supporting Message 미사용 기준) */
  .body-box { position: absolute; left: 64px; top: 135px; width: 1152px; height: 521px; }

  /* ================= Flow Comparison (신규 구조) ================= */
  .fc-stage { display: flex; width: 100%; height: 100%; }

  /* -------- 좌측: 공유 Intake + 세대 라벨 -------- */
  .fc-left { flex: 0 0 214px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px; }
  .fc-intake { display: flex; align-items: center; }
  .fc-node { display: flex; flex-direction: column; align-items: center; gap: 3px; width: 62px; }
  .fc-node.label-top { flex-direction: column-reverse; }
  .fc-node img { height: 32px; width: auto; max-width: 58px; object-fit: contain; }
  .fc-node .fc-lbl { font: 600 9.6pt/1.2 var(--font-base); text-align: center; color: var(--c-ink); }
  .fc-lbl.underline { text-decoration: underline; }
  .fc-arrow { flex: 0 0 18px; text-align: center; font-size: 14px; color: var(--c-slate); }
  .fc-arrow.gen1 { color: var(--c-red); font-weight: 700; }
  .fc-arrow.gen2 { color: var(--c-green); font-weight: 700; }

  .fc-tags { display: flex; flex-direction: column; align-items: center; gap: 8px; width: 100%; }
  .fc-tag { width: 100%; max-width: 172px; text-align: center; padding: 6px 6px; border-radius: 2px; font: 700 10.6pt var(--font-base); color: #fff; }
  .fc-tag.gen1 { background: var(--c-red); }
  .fc-tag.gen2 { background: var(--c-green); }
  .fc-emph { text-align: center; font: 700 9pt/1.5 var(--font-base); color: var(--c-green); text-decoration: underline; margin-top: -2px; }

  /* -------- 분기 브래킷: 블랙매스에서 오른쪽으로, 위/아래로 갈라짐 -------- */
  .fc-right { position: relative; flex: 1; display: flex; flex-direction: column; padding-left: 28px; }
  .fc-branch-v { position: absolute; left: 0; top: 27%; height: 46%; width: 1px; background: var(--c-ink); }
  .fc-branch-h { position: absolute; left: 0; width: 16px; height: 1px; background: var(--c-ink); }
  .fc-branch-h.gen1 { top: 27%; }
  .fc-branch-h.gen2 { top: 73%; }

  .fc-lane { flex: 1; display: flex; align-items: center; padding-left: 16px; }
  .fc-divider-dashed { height: 0; border-top: 1px dashed var(--c-slate); margin: 2px 40px; }

  /* -------- 1세대 결과물: 4종 나란히 + 공통라벨, 아래로 꺾여 폐흑연 -------- */
  .fc-result-block { display: flex; flex-direction: column; align-items: center; gap: 3px; }
  .fc-powrow { display: flex; gap: 5px; }
  .fc-powrow img { width: 28px; height: 24px; object-fit: contain; border: 1px solid var(--c-red-tint); }
  .fc-result-label { font: 700 10pt var(--font-base); color: var(--c-ink); }
  .fc-bend { display: flex; flex-direction: column; align-items: center; color: var(--c-red); font-size: 13px; line-height: 1; margin-top: 2px; }
  .fc-byproduct { display: flex; align-items: center; gap: 6px; opacity: 0.75; margin-top: 2px; }
  .fc-byproduct img { height: 20px; width: auto; object-fit: contain; }
  .fc-byproduct span { font: 500 9pt var(--font-base); color: var(--c-slate); }

  /* -------- 2세대 재분기 (부유선별 이후 위/아래) -------- */
  .fc-subbranch { position: relative; display: flex; flex-direction: column; gap: 10px; padding-left: 20px; }
  .fc-subbranch-v { position: absolute; left: 0; top: 22%; height: 56%; width: 1px; background: var(--c-green); }
  .fc-subbranch-h { position: absolute; left: 0; width: 12px; height: 1px; background: var(--c-green); }
  .fc-subrow { position: relative; display: flex; align-items: center; }
  .fc-subrow:first-child .fc-subbranch-h { top: 0; }
  .fc-subrow:last-child .fc-subbranch-h { top: 0; }
  .fc-subrow { padding-left: 14px; }

  .fc-resultpair { display: flex; flex-direction: column; align-items: center; gap: 3px; }
  .fc-resultpair .fc-pair-imgs { display: flex; gap: 8px; }
  .fc-resultpair img { height: 30px; width: auto; object-fit: contain; }
  .fc-resultpair .fc-result-label { font: 700 10pt var(--font-base); }
</style>
</head>
<body>
<div id="deck">
<section class="slide">
  <div class="hdr-ci"><img src="assets/images/ci-color.png" alt="COSOLUS"></div>
  <div class="hdr-submessage">We promise tomorrow</div>
  <div class="hdr-divider"></div>
  <div class="hdr-section-label">TECHNOLOGY</div>
  <div class="hdr-main-title">[솔루션2] 개요 – 친환경 차세대 배터리 재활용 공정기술 (2세대)</div>

  <div class="body-box">
    <div class="fc-stage">

      <!-- 좌측: 공유 Intake + 세대 라벨 -->
      <div class="fc-left">
        <div class="fc-intake">
          <div class="fc-node"><img src="assets/images/start-battery.png" alt="전기차 배터리팩"><span class="fc-lbl">전기차<br>배터리팩</span></div>
          <div class="fc-arrow">→</div>
          <div class="fc-node"><img src="assets/images/pretreat-icon.png" alt="전처리"><span class="fc-lbl">전처리</span></div>
          <div class="fc-arrow">→</div>
          <div class="fc-node"><img src="assets/images/blackmass.png" alt="블랙매스"><span class="fc-lbl">블랙매스</span></div>
        </div>
        <div class="fc-tags">
          <div class="fc-tag gen1">기존공정 (1세대)</div>
          <div class="fc-tag gen2">COSOLUS (2세대)</div>
          <div class="fc-emph">경제성<br>친환경성<br>양산성 확보</div>
        </div>
      </div>

      <!-- 우측: 분기 브래킷 + 두 세대 Lane -->
      <div class="fc-right">
        <span class="fc-branch-v"></span>
        <span class="fc-branch-h gen1"></span>
        <span class="fc-branch-h gen2"></span>

        <!-- 1세대 Lane (위, 레드) -->
        <div class="fc-lane gen1">
          <div class="fc-node label-top"><span class="fc-lbl">용매추출</span><img src="assets/images/gen1-extraction-equip.png" alt="용매추출"></div>
          <div class="fc-arrow gen1">→</div>
          <div class="fc-result-block">
            <div class="fc-powrow">
              <img src="assets/images/gen1-mnso4.png" alt="MnSO4">
              <img src="assets/images/gen1-niso4.png" alt="NiSO4">
              <img src="assets/images/gen1-coso4.png" alt="CoSO4">
              <img src="assets/images/gen1-li2co3.png" alt="Li2CO3">
            </div>
            <div class="fc-result-label">재활용 양극재</div>
            <div class="fc-bend">↓</div>
            <div class="fc-byproduct"><img src="assets/images/gen1-waste-graphite.jpeg" alt="폐흑연"><span>폐흑연</span></div>
          </div>
        </div>

        <div class="fc-divider-dashed"></div>

        <!-- 2세대 Lane (아래, 다크그린) -->
        <div class="fc-lane gen2">
          <div class="fc-node label-top"><span class="fc-lbl underline">부유선별</span><img src="assets/images/gen2-flotation-equip.png" alt="부유선별"></div>
          <div class="fc-arrow gen2">→</div>

          <div class="fc-subbranch">
            <span class="fc-subbranch-v"></span>

            <div class="fc-subrow">
              <span class="fc-subbranch-h"></span>
              <div class="fc-node"><img src="assets/images/gen2-cathode-blackmass.png" alt="양극재용 블랙매스"><span class="fc-lbl">양극재용<br>블랙매스</span></div>
              <div class="fc-arrow gen2">→</div>
              <div class="fc-node label-top"><span class="fc-lbl underline">건식환원</span><img src="assets/images/gen2-dryreduction.png" alt="건식환원"></div>
              <div class="fc-arrow gen2">→</div>
              <div class="fc-resultpair">
                <div class="fc-pair-imgs">
                  <img src="assets/images/gen2-cobalt.png" alt="코발트">
                  <img src="assets/images/gen2-nickel.png" alt="니켈">
                </div>
                <div class="fc-result-label">재활용 양극재</div>
              </div>
            </div>

            <div class="fc-subrow">
              <span class="fc-subbranch-h"></span>
              <div class="fc-node"><img src="assets/images/gen2-anode-blackmass.png" alt="음극재용 블랙매스"><span class="fc-lbl">음극재용<br>블랙매스</span></div>
              <div class="fc-arrow gen2">→</div>
              <div class="fc-node label-top"><span class="fc-lbl underline">유도가열</span><img src="assets/images/gen2-induction-heat.png" alt="유도가열"></div>
              <div class="fc-arrow gen2">→</div>
              <div class="fc-node"><img src="assets/images/gen2-graphite-refined.png" alt="고순도 정제흑연"><span class="fc-lbl">고순도<br>정제흑연</span></div>
            </div>
          </div>
        </div>

      </div>
    </div>
  </div>

  <div class="hdr-page-number">15</div>
</section>
</div>
</body>
</html>
