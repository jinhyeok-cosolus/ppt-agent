<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>15p 6차 재테스트(v6) — [솔루션2] 개요 (라벨 플로팅·전체 화살표 도형)</title>
<!--
  input/15, 16p 테스트용_6.docx 15페이지 제작 지시서만을 기준으로 독립적으로
  새로 구성한 6차 테스트(정식 [1]~[9] 워크플로우 아님, Subagent 미사용,
  Material Analysis/전체 QA 생략, 이전 차수 HTML/CSS 미참조·미재사용 —
  클래스명도 전부 새로 작성: px6- 접두사).

  _6 지시서가 이전 차수(_5) 대비 명시적으로 바꾼 항목만 반영:
  1) 이미지-단계 매칭표 변경 — image1.png이 "전기차+배터리 일체형 하나의
     이미지"로 명시되고 image2.png는 표에서 아예 빠짐 → 시작 구간을 다시
     "전기차배터리팩(단일 노드, image1.png) → 전처리 → 블랙매스"로 구성
     (_5의 2단계 분리 구성 대신).
  2) "모든 연결은 반드시 화살표 도형으로, 대시로 대체 금지" — 좌측 Intake
     구간의 연결선에도 명시적 화살촉을 추가(이전 차수는 단순 바 형태였음).
     단, 분기 브래킷(ㄴ자 분기선) 자체는 지시서에서 "화살표"와 별도로
     "분기선"이라 표현하고 있어 구조적 포크 선으로 유지(화살촉 없음).
  3) 라벨 박스 위치 규칙 강화 — "화살표 흐름 바깥(위쪽)에 별도로 띄워
     화살표를 관통하지 않도록" 배치. 인라인으로 화살표 앞에 두는 대신
     absolute로 각 Lane 상단에 플로팅시키고, 그 아래로 분기점→첫 공정
     아이콘까지 화살표가 끊기지 않고 그대로 지나가게 함.
  4) 재활용 양극재 4종 순서 고정(MnSO4→NiSO4→CoSO4→Li2CO3, 왼쪽부터)과
     테두리 없는 이미지 배치, 공통 라벨은 아이콘 아래.
  5) COSOLUS 강조문구 3줄 유지, Bold+밑줄, 존재감 있는 크기로.
  블랙매스 기준 위/아래 Lane 대칭 배치, 색상 최우선 규칙(1세대 전부
  #C0392B, 2세대 전부 #005151, 브래킷 상/하 색 분할), 밀도·크기 규칙,
  제목-도식 여백은 _5와 동일하게 명시되어 있어 유지. 이미지는 _6.docx
  매칭표 그대로 사용(신규 생성 없음). Header는 Hard Rule §9 그대로.
-->
<style>
  :root {
    --c-dark: #034443;
    --c-ink: #162B1F;
    --c-slate: #5A6664;
    --c-gray: #8C9694;
    --c-submessage: #478689;
    --c-white: #FFFFFF;
    --c-r: #C0392B;
    --c-g: #005151;
    --font-base: "Pretendard", "Malgun Gothic", "맑은 고딕", sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #555; font-family: var(--font-base); color: var(--c-ink); word-break: keep-all; }
  #deck { display: flex; padding: 24px; }
  .slide { position: relative; width: 1280px; height: 720px; background: var(--c-white); overflow: hidden; }

  /* ---------- 공통 Header System (Hard Rule §9, 그대로 유지) ---------- */
  .hdr-ci { position: absolute; left: 64px; top: 25px; height: 20px; }
  .hdr-ci img { height: 20px; width: auto; display: block; }
  .hdr-submessage { position: absolute; right: 64px; top: 25px; font: 500 14pt/20px var(--font-base); color: var(--c-submessage); white-space: nowrap; }
  .hdr-divider { position: absolute; left: 64px; top: 56px; width: 1152px; height: 1px; background: var(--c-submessage); }
  .hdr-section-label { position: absolute; left: 68px; top: 62px; font: 300 12pt var(--font-base); color: var(--c-gray); letter-spacing: 0.06em; text-transform: uppercase; }
  .hdr-main-title { position: absolute; left: 64px; top: 83px; width: 1152px; font: 800 28pt/1.25 var(--font-base); color: var(--c-dark); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .hdr-page-number { position: absolute; right: 44px; bottom: 24px; font: 300 14pt var(--font-base); color: var(--c-gray); }

  .body-box { position: absolute; left: 64px; top: 135px; width: 1152px; height: 521px; padding-top: 20px; }

  /* ================= px6 Flow ================= */
  .px6-stage { display: flex; width: 100%; height: 100%; gap: 6px; }

  .px6-left { flex: 0 0 210px; display: flex; align-items: center; justify-content: center; }
  .px6-intake { display: flex; align-items: center; width: 100%; }
  .px6-node { display: flex; flex-direction: column; align-items: center; gap: 4px; }
  .px6-node.label-top { flex-direction: column-reverse; }
  .px6-node img { height: 44px; width: auto; max-width: 70px; object-fit: contain; }
  .px6-node .lbl { font: 800 10.5pt/1.15 var(--font-base); text-align: center; color: var(--c-ink); }
  .lbl.underline { text-decoration: underline; }

  /* 모든 흐름 연결선은 화살표 도형(화살촉 포함) — Intake 구간용 */
  .px6-arrow-n { flex: 1 1 auto; min-width: 16px; height: 2.5px; background: var(--c-slate); position: relative; margin: 0 3px; }
  .px6-arrow-n::after {
    content: ""; position: absolute; right: -1px; top: 50%; transform: translateY(-50%);
    border-top: 5px solid transparent; border-bottom: 5px solid transparent; border-left: 7px solid var(--c-slate);
  }

  /* -------- 분기 브래킷(구조적 분기선, 화살촉 없음): 상단 절반 빨강 / 하단 절반 다크그린 -------- */
  .px6-right { position: relative; flex: 1; display: flex; flex-direction: column; padding-left: 22px; }
  .px6-bracket-v {
    position: absolute; left: 0; top: 25%; height: 50%; width: 3px;
    background: linear-gradient(to bottom, var(--c-r) 0%, var(--c-r) 50%, var(--c-g) 50%, var(--c-g) 100%);
  }
  .px6-bracket-h { position: absolute; left: 0; width: 18px; height: 3px; }
  .px6-bracket-h.r { top: 25%; background: var(--c-r); }
  .px6-bracket-h.g { top: 75%; background: var(--c-g); }

  .px6-lane { position: relative; flex: 1; display: flex; align-items: center; padding-left: 20px; gap: 10px; }
  .px6-divider-dashed { height: 0; border-top: 2px dashed var(--c-slate); margin: 0 30px; }

  /* -------- 세대 라벨: 화살표 흐름 위쪽에 플로팅(화살표를 가리지 않음) -------- */
  .px6-tag-float { position: absolute; left: 20px; top: 2px; display: flex; flex-direction: column; align-items: flex-start; gap: 3px; z-index: 2; }
  .px6-tag { padding: 6px 10px; border-radius: 2px; font: 800 11pt var(--font-base); color: #fff; white-space: nowrap; }
  .px6-tag.r { background: var(--c-r); }
  .px6-tag.g { background: var(--c-g); }
  .px6-emph { font: 800 9pt/1.5 var(--font-base); color: var(--c-g); }
  .px6-emph div { text-decoration: underline; }

  /* 흐름 화살표(색상 규칙 적용, 폭 채움) */
  .px6-conn { flex: 1 1 auto; min-width: 20px; height: 3px; position: relative; }
  .px6-conn.r { background: var(--c-r); }
  .px6-conn.g { background: var(--c-g); }
  .px6-conn::after {
    content: ""; position: absolute; right: -1px; top: 50%; transform: translateY(-50%);
    border-top: 6px solid transparent; border-bottom: 6px solid transparent; border-left: 9px solid;
  }
  .px6-conn.r::after { border-left-color: var(--c-r); }
  .px6-conn.g::after { border-left-color: var(--c-g); }

  /* -------- 1세대 결과물 (테두리 없이 이미지만, 순서 고정) -------- */
  .px6-result-block { display: flex; flex-direction: column; align-items: center; gap: 4px; flex: 0 0 auto; margin-left: auto; }
  .px6-powrow { display: flex; gap: 8px; }
  .px6-powrow img { width: 40px; height: 34px; object-fit: contain; }
  .px6-result-label { font: 800 11.5pt var(--font-base); color: var(--c-ink); }
  .px6-bend { color: var(--c-r); font-size: 16px; line-height: 1; font-weight: 800; margin-top: 2px; }
  .px6-byproduct { display: flex; align-items: center; gap: 8px; margin-top: 2px; }
  .px6-byproduct img { height: 30px; width: auto; object-fit: contain; }
  .px6-byproduct span { font: 700 10.5pt var(--font-base); color: var(--c-slate); }

  /* -------- 2세대 재분기 -------- */
  .px6-subbranch { position: relative; flex: 1; display: flex; flex-direction: column; gap: 8px; padding-left: 18px; }
  .px6-subbranch-v { position: absolute; left: 0; top: 18%; height: 64%; width: 2.5px; background: var(--c-g); }
  .px6-subrow { position: relative; display: flex; align-items: center; gap: 10px; padding-left: 16px; }
  .px6-subrow::before { content: ""; position: absolute; left: 0; top: 50%; width: 14px; height: 2.5px; background: var(--c-g); }

  .px6-resultpair { display: flex; flex-direction: column; align-items: center; gap: 4px; flex: 0 0 auto; }
  .px6-resultpair .imgs { display: flex; gap: 10px; }
  .px6-resultpair img { height: 42px; width: auto; object-fit: contain; }
</style>
</head>
<body>
<div id="deck">
<section class="slide">
  <div class="hdr-ci"><img src="assets/images/ci-color.png" alt="COSOLUS"></div>
  <div class="hdr-submessage">We promise tomorrow</div>
  <div class="hdr-divider"></div>
  <div class="hdr-section-label">TECHNOLOGY</div>
  <div class="hdr-main-title">[솔루션2] 개요 – 친환경 차세대 배터리 재활용 공정기술 (2세대)</div>

  <div class="body-box">
    <div class="px6-stage">

      <!-- 좌측: 공유 Intake (전기차배터리팩[단일 이미지] → 전처리 → 블랙매스), 전부 화살표 도형 -->
      <div class="px6-left">
        <div class="px6-intake">
          <div class="px6-node"><img src="assets/images/start-ev-battery.png" alt="전기차 배터리팩"><span class="lbl">전기차<br>배터리팩</span></div>
          <div class="px6-arrow-n"></div>
          <div class="px6-node"><img src="assets/images/pretreat-icon.png" alt="전처리"><span class="lbl">전처리</span></div>
          <div class="px6-arrow-n"></div>
          <div class="px6-node"><img src="assets/images/blackmass.png" alt="블랙매스"><span class="lbl">블랙매스</span></div>
        </div>
      </div>

      <!-- 우측: 상/하 대칭 분기선(브래킷) + 두 세대 Lane(라벨은 화살표 위쪽에 플로팅) -->
      <div class="px6-right">
        <span class="px6-bracket-v"></span>
        <span class="px6-bracket-h r"></span>
        <span class="px6-bracket-h g"></span>

        <!-- 1세대 Lane (위, 전부 빨강) -->
        <div class="px6-lane">
          <div class="px6-tag-float"><div class="px6-tag r">기존공정 (1세대)</div></div>
          <div class="px6-conn r"></div>
          <div class="px6-node label-top"><span class="lbl">용매추출</span><img src="assets/images/gen1-extraction-equip.png" alt="용매추출"></div>
          <div class="px6-conn r"></div>
          <div class="px6-result-block">
            <div class="px6-powrow">
              <img src="assets/images/gen1-mnso4.png" alt="MnSO4">
              <img src="assets/images/gen1-niso4.png" alt="NiSO4">
              <img src="assets/images/gen1-coso4.png" alt="CoSO4">
              <img src="assets/images/gen1-li2co3.png" alt="Li2CO3">
            </div>
            <div class="px6-result-label">재활용 양극재</div>
            <div class="px6-bend">↓</div>
            <div class="px6-byproduct"><img src="assets/images/gen1-waste-graphite.jpeg" alt="폐흑연"><span>폐흑연</span></div>
          </div>
        </div>

        <div class="px6-divider-dashed"></div>

        <!-- 2세대 Lane (아래, 전부 다크그린) -->
        <div class="px6-lane">
          <div class="px6-tag-float">
            <div class="px6-tag g">COSOLUS (2세대)</div>
            <div class="px6-emph"><div>경제성</div><div>친환경성</div><div>양산성 확보</div></div>
          </div>
          <div class="px6-conn g"></div>
          <div class="px6-node label-top"><span class="lbl underline">부유선별</span><img src="assets/images/gen2-flotation-equip.png" alt="부유선별"></div>
          <div class="px6-conn g"></div>

          <div class="px6-subbranch">
            <span class="px6-subbranch-v"></span>

            <div class="px6-subrow">
              <div class="px6-node"><img src="assets/images/gen2-cathode-blackmass.png" alt="양극재용 블랙매스"><span class="lbl">양극재용<br>블랙매스</span></div>
              <div class="px6-conn g"></div>
              <div class="px6-node label-top"><span class="lbl underline">건식환원</span><img src="assets/images/gen2-dryreduction.png" alt="건식환원"></div>
              <div class="px6-conn g"></div>
              <div class="px6-resultpair">
                <div class="imgs">
                  <img src="assets/images/gen2-cobalt.png" alt="코발트">
                  <img src="assets/images/gen2-nickel.png" alt="니켈">
                </div>
                <div class="px6-result-label">재활용 양극재</div>
              </div>
            </div>

            <div class="px6-subrow">
              <div class="px6-node"><img src="assets/images/gen2-anode-blackmass.png" alt="음극재용 블랙매스"><span class="lbl">음극재용<br>블랙매스</span></div>
              <div class="px6-conn g"></div>
              <div class="px6-node label-top"><span class="lbl underline">유도가열</span><img src="assets/images/gen2-induction-heat.png" alt="유도가열"></div>
              <div class="px6-conn g"></div>
              <div class="px6-node"><img src="assets/images/gen2-graphite-refined.png" alt="고순도 정제흑연"><span class="lbl">고순도<br>정제흑연</span></div>
            </div>
          </div>
        </div>

      </div>
    </div>
  </div>

  <div class="hdr-page-number">15</div>
</section>
</div>
</body>
</html>
