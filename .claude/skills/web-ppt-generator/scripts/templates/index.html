<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>웹PPT 초안</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<!--
  슬라이드는 section.slide(data-index="N") 단위로 구성한다.
  각 슬라이드 하단의 SLIDES:INSERT 표시 위치에 content-designer가
  slide_outline.md를 기반으로 실제 슬라이드 마크업을 채워 넣는다.

  차트가 필요한 슬라이드는 canvas 요소 + data-chart-mode="native|image" +
  data-chart-json="원본 데이터" 속성을 함께 남겨 pptx 변환 시 참조하도록 한다.
-->
<div id="deck">

  <section class="slide slide--cover" data-index="1">
    <!-- 표지: docs/slide-design-rules/01_cover_design_V2.md 구조로 채운다.
         공통 Header·좌측 Brand Line·페이지 번호를 넣지 않는다(Hard Rule §9). -->
  </section>

  <!--
    일반 본문 슬라이드 공통 마크업(Hard Rule §9) — 모든 본문 슬라이드에 그대로 복사한다.
    클래스 이름·순서를 바꾸지 않고 텍스트(섹션 라벨·제목·페이지 번호)만 채운다.
    기업개요는 components/company-overview.html, Closing은 slide--closing(아래 예시)을 쓴다.

  <section class="slide" data-index="{N}">
    <div class="deck-left-line"><div class="deck-left-line__top"></div><div class="deck-left-line__bottom"></div></div>
    <img class="header-ci" src="assets/ci/cosolus-ci.png" alt="COSOLUS">
    <p class="header-submessage">We promise tomorrow</p>
    <div class="header-divider"></div>
    <p class="header-section-label">{SECTION}</p>
    <h2 class="header-main-title">{Main Title}</h2>
    <div class="body-box"> ... Layout 콘텐츠 ... </div>
    <p class="deck-page">{N}</p>
  </section>

    Closing(마지막 표지) — 디자인은 별도 레퍼런스 제공 후 01_cover_design_V2.md "Closing" 절에서
    확정한다. 지금은 공통 Header·좌측 Brand Line·페이지 번호를 넣지 않는 예외 구조만 둔다.

  <section class="slide slide--closing" data-index="{마지막 N}"></section>
  -->

  <!-- SLIDES:INSERT -->

</div>

<div id="nav-hint" aria-hidden="true">← → 키로 슬라이드 이동</div>

<script src="assets/vendor/chart.min.js"></script>
<script>Chart.defaults.font.family = "Pretendard";</script>
<script>
  // 슬라이드 간 이동(브라우저 프레젠테이션 모드 대체용 최소 스크립트)
  const slides = Array.from(document.querySelectorAll(".slide"));
  let current = 0;
  function show(i) {
    slides.forEach((s, idx) => s.classList.toggle("is-active", idx === i));
  }
  document.addEventListener("keydown", (e) => {
    if (e.key === "ArrowRight" && current < slides.length - 1) { current++; show(current); }
    if (e.key === "ArrowLeft" && current > 0) { current--; show(current); }
  });
  show(0);
</script>
</body>
</html>
