<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>웹PPT 초안</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<!--
  슬라이드는 <section class="slide" data-index="N"> 단위로 구성한다.
  각 슬라이드 하단의 <!-- SLIDES:INSERT --> 위치에 content-designer가
  slide_outline.md를 기반으로 실제 슬라이드 마크업을 채워 넣는다.

  차트가 필요한 슬라이드는 <canvas> + data-chart-mode="native|image" +
  data-chart-json="원본 데이터" 속성을 함께 남겨 pptx 변환 시 참조하도록 한다.
-->
<div id="deck">

  <section class="slide slide--cover" data-index="1">
    <!-- 표지: 고정 규칙(로고/브랜드 표지)이 있다면 여기 적용 -->
    <h1>발표 제목</h1>
    <p class="subtitle">부제 / 발표자 / 날짜</p>
  </section>

  <!-- SLIDES:INSERT -->

</div>

<div id="nav-hint" aria-hidden="true">← → 키로 슬라이드 이동</div>

<script src="assets/vendor/chart.min.js"></script>
<script>Chart.defaults.font.family = "Pretendard";</script>
<script>
  // 슬라이드 간 이동(브라우저 프레젠테이션 모드 대체용 최소 스크립트)
  const slides = Array.from(document.querySelectorAll(".slide"));
  let current = 0;
  function show(i) {
    slides.forEach((s, idx) => s.classList.toggle("is-active", idx === i));
  }
  document.addEventListener("keydown", (e) => {
    if (e.key === "ArrowRight" && current < slides.length - 1) { current++; show(current); }
    if (e.key === "ArrowLeft" && current > 0) { current--; show(current); }
  });
  show(0);
</script>
</body>
</html>
