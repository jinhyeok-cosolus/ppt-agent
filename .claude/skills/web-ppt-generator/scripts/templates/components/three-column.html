<!--
  Three-Column Insight Layout 재사용 구현 골격 — HTML (web-ppt-generator, 2026-08-25)
  같은 폴더 three-column.css와 함께 사용한다. docs/slide-design-rules/three-column/
  three-column.md의 구조 규칙(§2~§7)을 매 프로젝트마다 반복 타이핑하지 않도록 뼈대만
  옮겨 담았다.

  이 파일은 새 구조 규칙을 만들지 않는다 — three-column.md와 Hard Rule §10/§11이
  이미 정한 구조를 그대로 옮긴 것뿐이다. 핵심은 Header 행과 Body 행을 처음부터 분리된
  두 블록(.tc-header-row / .tc-body-row)으로 작성하는 것이다 — 절대 Header Bar와 Body
  Column을 같은 `.col` 안에 하나의 flex gap으로 묶어 작성하지 않는다(그렇게 하면 Header
  Gap과 Body Divider 자리가 같은 값 하나를 공유하게 되어 Divider를 넣을 자리가 없어진다).

  사용 방법:
  1. 아래 <div class="tc-grid">...</div> 전체를 슬라이드의 body-box 안에 복사한다.
  2. Column 개수는 정의상 3개 고정이다 — Header Bar 3개, Body Column 3개, 그 사이
     Divider 2개(각각 인접 Column Gap의 중앙)를 그대로 유지한다.
  3. 각 Header Bar 텍스트, 각 Column의 Key Message/Main Visual/Supporting Evidence
     내용은 이 골격이 정하지 않는다 — three-column.md §4~§8과 slide_outline.md의
     Content Region 판단에 따라 채운다. Header Bar 스타일(comp-header comp-header--
     parallel)은 Hard Rule §10 그대로이며 3개 모두 동일한 Parallel Variant를 쓴다.
  4. Main Visual/Supporting Evidence는 콘텐츠 성격에 따라 자유롭게 구성한다(텍스트만,
     이미지 포함, 통계 강조 등) — 아래는 텍스트 bullet-list만 있는 최소 예시이며, 이미지가
     필요한 Column은 <ul class="bullet-list">...</ul> 뒤에 이미지 요소를 추가한다.
-->

<div class="tc-grid">

  <div class="tc-header-row">
    <div class="comp-header comp-header--parallel">{Column 1 제목}</div>
    <div class="comp-header comp-header--parallel">{Column 2 제목}</div>
    <div class="comp-header comp-header--parallel">{Column 3 제목}</div>
  </div>

  <div class="tc-body-row">
    <div class="tc-col-body">
      <ul class="bullet-list">
        <li class="t-body">{Column 1 내용}</li>
      </ul>
      <!-- 필요 시 Main Visual(이미지/차트/숫자 등)을 여기 추가 -->
    </div>

    <div class="v-divider tc-divider"></div>

    <div class="tc-col-body">
      <ul class="bullet-list">
        <li class="t-body">{Column 2 내용}</li>
      </ul>
    </div>

    <div class="v-divider tc-divider"></div>

    <div class="tc-col-body">
      <ul class="bullet-list">
        <li class="t-body">{Column 3 내용}</li>
      </ul>
    </div>
  </div>

</div>
