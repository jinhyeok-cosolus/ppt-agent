<!--
  Closing(마지막 표지) 구조 고정형 골격 — HTML
  같은 폴더 closing.css와 함께 사용한다.
  규칙: docs/slide-design-rules/01_cover_design_V2.md "Closing" 절 (Status: 확정)

  교체 가능한 것은 {} 표시 2곳뿐이다:
    1) 마무리 메시지(최대 3줄, 의미 단위로 한 줄씩 <p>에 넣는다 — 줄이 적으면 <p>를 지운다. 한 줄이 1160px를 넘지 않게)
    2) 배경 사진 파일(기본값 docs/brand-assets/closing-images/closing-photo.png를 assets/images/로 복사.
       교체 시 흑백·약 1.03:1 비율 이미지를 쓴다 — CSS filter 금지)
  Motto·CI·Thank You·선은 고정이다. 공통 Header·좌측 Brand Line·페이지 번호(.deck-page)는 넣지 않는다.
-->
<section class="slide slide--closing" data-index="{N}">

  <!-- 배경 사진(의도된 프레임 — data-visual-frame="panel") + 그라데이션 오버레이 -->
  <img class="cl-photo" src="assets/images/{closing-photo}.png" alt="{사진 설명}"
       data-visual-role="main" data-visual-frame="panel">
  <div class="cl-overlay"></div>

  <p class="cl-motto">Small actions, BIG DIFFERENCE</p>
  <img class="cl-ci" src="assets/ci/cosolus-ci-white-closing.png" alt="COSOLUS">

  <!-- 마무리 메시지 -->
  <div class="cl-message">
    <p>{메시지 1줄}</p>
    <p>{메시지 2줄}</p>
    <p>{메시지 3줄}</p>
  </div>

  <p class="cl-thanks">Thank You</p>
  <div class="cl-line"></div>
  <div class="cl-line-end"></div>

</section>
